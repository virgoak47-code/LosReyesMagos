<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Abarrotes Reyes Magos - POS</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js" onerror="window.camLibFailed=true"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --amber: #f59e0b;
      --emerald: #10b981;
      --rose: #e11d48;
      --blue: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --orange: #f97316;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    html, body {
      background-color: var(--bg);
    }

    body {
      color: var(--text);
      padding: 12px;
      max-width: 500px;
      margin: 0 auto;
      padding-bottom: 50px;
      padding-top: max(12px, env(safe-area-inset-top, 0px));
      padding-bottom: max(50px, env(safe-area-inset-bottom, 0px));
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      color: var(--amber);
    }

    .version {
      font-size: 10px;
      color: var(--emerald);
      font-weight: bold;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .btn-amber { background: var(--amber); color: #000; }
    .btn-emerald { background: var(--emerald); color: #000; }
    .btn-slate { background: #334155; color: #fff; }
    .btn-rose { background: var(--rose); color: #fff; }
    .btn-blue { background: var(--blue); color: #fff; }
    .btn-orange { background: var(--orange); color: #fff; }

    .input {
      width: 100%;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .input:focus { border-color: var(--amber); }

    .scanner-container {
      background: #020617;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }

    #reader {
      width: 100%;
      min-height: 120px;
      border-radius: 6px;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      max-height: 200px;
      object-fit: cover;
    }

    .flex-gap { display: flex; gap: 8px; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      gap: 8px;
      flex-wrap: wrap;
    }

    .cart-qty-btn {
      width: 28px;
      height: 28px;
      background: var(--border);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .hidden { display: none !important; }

    .stock-ok { color: var(--emerald); }
    .stock-low { color: var(--amber); font-weight: bold; }
    .stock-out { color: var(--rose); font-weight: bold; }

    .product-row {
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }

    .product-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .product-actions {
      display: flex;
      gap: 5px;
      margin-top: 7px;
      flex-wrap: wrap;
    }

    .small-btn {
      border: none;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      color: #fff;
    }

    .quick-search { margin-top: 10px; }

    .quick-product {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px;
      margin-top: 6px;
      cursor: pointer;
    }

    .quick-product:active { transform: scale(0.98); }

    .badge {
      display: inline-block;
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 9px;
      font-weight: bold;
      white-space: nowrap;
    }

    .badge-green { background: rgba(16,185,129,.15); color: var(--emerald); }
    .badge-yellow { background: rgba(245,158,11,.15); color: var(--amber); }
    .badge-red { background: rgba(225,29,72,.15); color: var(--rose); }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .stat {
      background: #020617;
      border-radius: 8px;
      padding: 10px 5px;
      text-align: center;
    }

    .stat-value {
      font-size: 17px;
      font-weight: 900;
      color: var(--emerald);
      font-family: monospace;
    }

    .stat-label {
      font-size: 8px;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: bold;
    }

    .sale-row {
      background: #020617;
      border-radius: 8px;
      padding: 9px;
      margin-bottom: 7px;
      border: 1px solid rgba(255,255,255,.05);
    }

    .empty-message {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      padding: 15px 0;
    }

    @media (max-width: 360px) {
      .header { align-items: flex-start; }
      .title { font-size: 14px; }
      .stat-value { font-size: 14px; }
    }
  </style>
</head>

<body>

  <!-- ENCABEZADO -->
  <div class="header">
    <div>
      <div class="title">🏪 Abarrotes Reyes Magos</div>
      <div class="version">Punto de Venta [v6.1 Inventario]</div>
    </div>

    <button class="btn btn-slate" style="width:auto; padding:6px 10px; font-size:11px;" onclick="openInventory()">
      📋 Catálogo (<span id="catCount">0</span>)
    </button>
  </div>


  <!-- ESCÁNER / ENTRADA -->
  <div class="card">
    <div class="card-title">
      <span>Escáner / Entrada</span>
      <button id="camToggleBtn" class="btn btn-amber" style="width:auto; padding:6px 10px; font-size:11px;" onclick="toggleCam()">
        Encender Cámara
      </button>
    </div>

    <div class="scanner-container">
      <div id="camStatus" style="font-size:12px; color:var(--text-muted); margin-bottom:4px;">
        📷 Cámara Apagada
      </div>
      <div id="reader"></div>
    </div>

    <div class="flex-gap" style="margin-bottom:10px;">
      <label class="btn btn-slate" style="font-size:11px; cursor:pointer;">
        📷 Capturar Foto de Código
        <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="scanImage(this)">
      </label>
    </div>

    <div class="flex-gap">
      <input type="text" id="manualCode" class="input" placeholder="Escribir código de barras..." inputmode="numeric" onkeydown="if(event.key==='Enter') addManual()">
      <button class="btn btn-amber" style="width:100px;" onclick="addManual()">+ Agregar</button>
    </div>

    <!-- BUSCADOR RÁPIDO -->
    <div class="quick-search">
      <input type="text" id="quickSearch" class="input" placeholder="🔎 Buscar producto por nombre..." oninput="renderQuickSearch()">
      <div id="quickResults"></div>
    </div>
  </div>


  <!-- TICKET -->
  <div class="card">
    <div class="card-title">
      <span>🛒 Ticket de Compra</span>
      <button class="btn btn-rose" style="width:auto; padding:4px 8px; font-size:10px;" onclick="clearCart()">Vaciar</button>
    </div>

    <div id="cartList" style="min-height:60px; margin-bottom:10px;"></div>

    <div style="background:#020617; padding:12px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <span style="font-size:12px; font-weight:bold;">TOTAL:</span>
      <span id="totalText" style="font-size:26px; font-weight:900; color:var(--emerald); font-family:monospace;">$0.00</span>
    </div>

    <div class="grid-2" style="margin-bottom:10px;">
      <div>
        <label style="font-size:10px; color:var(--text-muted); font-weight:bold; display:block; margin-bottom:4px;">EFECTIVO ($)</label>
        <input type="number" id="payInput" class="input" placeholder="0.00" oninput="calcChange()">
      </div>
      <div>
        <label style="font-size:10px; color:var(--text-muted); font-weight:bold; display:block; margin-bottom:4px;">CAMBIO ($)</label>
        <div id="changeText" style="background:#020617; border:1px solid var(--border); border-radius:8px; padding:10px; font-weight:bold; font-family:monospace; font-size:14px; color:var(--text-muted);">$0.00</div>
      </div>
    </div>

    <button class="btn btn-emerald" style="padding:12px;" onclick="checkout()">✓ FINALIZAR Y COBRAR</button>
  </div>


  <!-- BOTÓN CORTE DE CAJA -->
  <div class="card">
    <div class="card-title">
      <span>💰 Caja del Día</span>
      <span id="todayLabel" style="font-size:9px;"></span>
    </div>

    <div class="stat-grid">
      <div class="stat">
        <div id="salesCount" class="stat-value">0</div>
        <div class="stat-label">TICKETS</div>
      </div>
      <div class="stat">
        <div id="cashTotal" class="stat-value">$0</div>
        <div class="stat-label">EFECTIVO</div>
      </div>
      <div class="stat">
        <div id="salesTotal" class="stat-value">$0</div>
        <div class="stat-label">VENTAS</div>
      </div>
    </div>

    <button class="btn btn-blue" style="margin-top:10px;" onclick="openCashRegister()">🧾 Ver Ventas y Corte de Caja</button>
  </div>


  <!-- MODAL NUEVO PRODUCTO -->
  <div id="newProdModal" class="modal hidden">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="color:var(--amber); font-size:14px;">📦 Producto No Registrado</strong>
        <button onclick="closeModal('newProdModal')" style="background:none; border:none; color:#fff; font-weight:bold; font-size:16px; cursor:pointer;">✕</button>
      </div>

      <div style="font-size:11px; color:var(--text-muted);">
        Código: <span id="modalCode" style="color:var(--amber); font-family:monospace;"></span>
      </div>

      <input type="text" id="newProdName" class="input" placeholder="Nombre del Producto">

      <div class="grid-2">
        <input type="number" step="any" id="newProdPrice" class="input" placeholder="Precio $">
        <input type="number" min="0" id="newProdStock" class="input" placeholder="Stock" value="10">
      </div>

      <button class="btn btn-amber" onclick="saveNewProd()">Guardar y Sumar</button>
    </div>
  </div>


  <!-- MODAL CATÁLOGO -->
  <div id="catModal" class="modal hidden">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="color:var(--amber);">📋 Catálogo de Productos</strong>
        <button onclick="closeModal('catModal')" style="background:none; border:none; color:#fff; font-weight:bold; font-size:16px; cursor:pointer;">✕</button>
      </div>

      <input type="text" id="catSearch" class="input" placeholder="🔍 Buscar producto..." oninput="renderCat()">

      <div id="catList" style="flex:1; overflow-y:auto; max-height:400px;"></div>

      <button class="btn btn-slate" onclick="closeModal('catModal')">Cerrar</button>
    </div>
  </div>


  <!-- MODAL EDITAR PRODUCTO -->
  <div id="editProdModal" class="modal hidden">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="color:var(--amber);">✏️ Editar Producto</strong>
        <button onclick="closeModal('editProdModal')" style="background:none; border:none; color:#fff; font-weight:bold; font-size:16px; cursor:pointer;">✕</button>
      </div>

      <div style="font-size:11px; color:var(--text-muted);">
        Código: <span id="editProdCode" style="color:var(--amber); font-family:monospace;"></span>
      </div>

      <input type="text" id="editProdName" class="input" placeholder="Nombre">
      <input type="number" step="any" id="editProdPrice" class="input" placeholder="Precio">
      <input type="number" min="0" id="editProdStock" class="input" placeholder="Stock">

      <button class="btn btn-emerald" onclick="saveEditProd()">✓ Guardar Cambios</button>
    </div>
  </div>


  <!-- MODAL CAJA -->
  <div id="cashModal" class="modal hidden">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="color:var(--amber);">🧾 Ventas del Día</strong>
        <button onclick="closeModal('cashModal')" style="background:none; border:none; color:#fff; font-weight:bold; font-size:16px; cursor:pointer;">✕</button>
      </div>

      <div id="cashSummary" style="background:#020617; border-radius:8px; padding:12px;"></div>
      <div id="salesHistory" style="max-height:350px; overflow-y:auto;"></div>

      <button class="btn btn-rose" onclick="closeDay()">🔒 Hacer Corte y Reiniciar Caja</button>
      <button class="btn btn-slate" onclick="closeModal('cashModal')">Cerrar</button>
    </div>
  </div>


<script>

  /* =========================================================
     BASE DE DATOS LOCAL
  ========================================================= */

  const DB_KEY = 'reyes_magos_v51';
  const SALES_KEY = 'reyes_magos_sales_v1';
  const LOW_STOCK = 3;

  let db = {};
  let cart = [];
  let sales = [];
  let html5QrCode = null;
  let isScanning = false;
  let pendingCode = null;
  let editingCode = null;
  let lastScanTime = 0;

  /* =========================================================
     INICIO
  ========================================================= */

  // Captura cualquier error de JavaScript y lo muestra en pantalla,
  // junto al área de cámara, para poder diagnosticar sin devtools.
  window.addEventListener('error', function(e) {
    const el = document.getElementById('camStatus');
    if (el) el.innerText = '⚠️ Error JS: ' + e.message;
    console.error('Error capturado:', e.message, e.filename, e.lineno);
  });

  window.addEventListener('unhandledrejection', function(e) {
    const el = document.getElementById('camStatus');
    if (el) el.innerText = '⚠️ Error (promesa): ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
  });

  window.onload = function() {
    try { db = JSON.parse(localStorage.getItem(DB_KEY)) || {}; }
    catch(e) { db = {}; }

    try { sales = JSON.parse(localStorage.getItem(SALES_KEY)) || []; }
    catch(e) { sales = []; }

    updateCatCount();
    renderCart();
    updateCashSummary();
    updateTodayLabel();
    renderQuickSearch();

    // Diagnóstico inmediato: avisa si la librería de cámara no cargó
    const camStatusEl = document.getElementById('camStatus');
    if (typeof Html5Qrcode === 'undefined') {
      if (camStatusEl) camStatusEl.innerText = '⚠️ Librería de cámara NO cargó (revisa tu conexión o un bloqueador de anuncios/scripts)';
    } else {
      if (camStatusEl) camStatusEl.innerText = '📷 Cámara Apagada (librería OK ✓)';
    }
  };

  /* =========================================================
     UTILIDADES
  ========================================================= */

  function saveDB() {
    localStorage.setItem(DB_KEY, JSON.stringify(db));
  }

  function saveSales() {
    localStorage.setItem(SALES_KEY, JSON.stringify(sales));
  }

  function todayKey() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function formatMoney(value) {
    return `$${Number(value || 0).toFixed(2)}`;
  }

  function updateTodayLabel() {
    const el = document.getElementById('todayLabel');
    if (!el) return;
    const d = new Date();
    el.innerText = d.toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric' });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function openModal(id) {
    const el = document.getElementById(id);
    if (el) el.classList.remove('hidden');
  }

  function closeModal(id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('hidden');
  }

  /* =========================================================
     CATÁLOGO
  ========================================================= */

  function updateCatCount() {
    const el = document.getElementById('catCount');
    if (el) el.innerText = Object.keys(db).length;
  }

  function getStock(code) {
    if (!db[code]) return 0;
    return Number(db[code].stock || 0);
  }

  function stockBadge(stock) {
    stock = Number(stock || 0);
    if (stock <= 0) return `<span class="badge badge-red">AGOTADO</span>`;
    if (stock <= LOW_STOCK) return `<span class="badge badge-yellow">STOCK BAJO: ${stock}</span>`;
    return `<span class="badge badge-green">STOCK: ${stock}</span>`;
  }

  function openInventory() {
    renderCat();
    openModal('catModal');
  }

  function renderCat() {
    const searchEl = document.getElementById('catSearch');
    const q = (searchEl ? searchEl.value : '').trim().toLowerCase();
    const list = document.getElementById('catList');
    if (!list) return;

    const codes = Object.keys(db)
      .filter(code => !q || db[code].name.toLowerCase().includes(q) || code.includes(q))
      .sort((a,b) => db[a].name.localeCompare(db[b].name));

    if (codes.length === 0) {
      list.innerHTML = '<div class="empty-message">No hay productos registrados.</div>';
      return;
    }

    list.innerHTML = codes.map(code => {
      const p = db[code];
      return `
        <div class="product-row">
          <div class="product-main">
            <div>
              <div style="font-weight:bold; font-size:13px;">${escapeHtml(p.name)}</div>
              <div style="font-size:10px; color:var(--text-muted); font-family:monospace;">${escapeHtml(code)} · ${formatMoney(p.price)}</div>
            </div>
            ${stockBadge(p.stock)}
          </div>
          <div class="product-actions">
            <button class="small-btn btn-blue" onclick="openEditProduct('${code}')">✏️ Editar</button>
            <button class="small-btn btn-emerald" onclick="quickAdd('${code}')">+ Agregar</button>
            <button class="small-btn btn-rose" onclick="deleteProduct('${code}')">🗑 Borrar</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function openEditProduct(code) {
    const p = db[code];
    if (!p) return;
    editingCode = code;
    document.getElementById('editProdCode').innerText = code;
    document.getElementById('editProdName').value = p.name;
    document.getElementById('editProdPrice').value = p.price;
    document.getElementById('editProdStock').value = p.stock;
    openModal('editProdModal');
  }

  function saveEditProd() {
    if (!editingCode) return;

    const name = document.getElementById('editProdName').value.trim();
    const price = parseFloat(document.getElementById('editProdPrice').value);
    const stock = parseInt(document.getElementById('editProdStock').value, 10);

    if (!name) { alert('Escribe el nombre del producto.'); return; }
    if (isNaN(price) || price < 0) { alert('Precio inválido.'); return; }
    if (isNaN(stock) || stock < 0) { alert('Stock inválido.'); return; }

    db[editingCode] = { name, price, stock };
    saveDB();

    const cartItem = cart.find(i => i.code === editingCode);
    if (cartItem) {
      cartItem.name = name;
      cartItem.price = price;
      if (cartItem.qty > stock) cartItem.qty = stock;
      if (cartItem.qty <= 0) cart = cart.filter(i => i.code !== editingCode);
    }

    renderCart();
    renderCat();
    updateCatCount();
    closeModal('editProdModal');
    editingCode = null;
  }

  function deleteProduct(code) {
    const p = db[code];
    if (!p) return;
    if (!confirm(`¿Borrar "${p.name}" del catálogo?`)) return;

    delete db[code];
    saveDB();
    updateCatCount();
    cart = cart.filter(i => i.code !== code);
    renderCart();
    renderCat();
  }

  /* =========================================================
     BUSCADOR RÁPIDO
  ========================================================= */

  function renderQuickSearch() {
    const searchEl = document.getElementById('quickSearch');
    const q = (searchEl ? searchEl.value : '').trim().toLowerCase();
    const container = document.getElementById('quickResults');
    if (!container) return;

    if (!q) { container.innerHTML = ''; return; }

    const matches = Object.keys(db)
      .filter(code => db[code].name.toLowerCase().includes(q))
      .slice(0, 8);

    if (matches.length === 0) {
      container.innerHTML = '<div class="empty-message">Sin resultados</div>';
      return;
    }

    container.innerHTML = matches.map(code => {
      const p = db[code];
      return `
        <div class="quick-product" onclick="quickAdd('${code}')">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-weight:bold; font-size:13px;">${escapeHtml(p.name)}</div>
              <div style="font-size:11px; color:var(--text-muted);">${formatMoney(p.price)}</div>
            </div>
            ${stockBadge(p.stock)}
          </div>
        </div>
      `;
    }).join('');
  }

  function quickAdd(code) {
    addProductToCart(code);
    const searchEl = document.getElementById('quickSearch');
    if (searchEl) searchEl.value = '';
    const resultsEl = document.getElementById('quickResults');
    if (resultsEl) resultsEl.innerHTML = '';
  }

  /* =========================================================
     AGREGAR PRODUCTO POR CÓDIGO
  ========================================================= */

  function addManual() {
    const input = document.getElementById('manualCode');
    if (!input) return;
    addToCartByCode(input.value);
    input.value = '';
    input.focus();
  }

  function addToCartByCode(code) {
    code = (code || '').toString().trim();
    if (!code) return;

    if (!db[code]) {
      pendingCode = code;
      document.getElementById('modalCode').innerText = code;
      document.getElementById('newProdName').value = '';
      document.getElementById('newProdPrice').value = '';
      document.getElementById('newProdStock').value = '10';
      openModal('newProdModal');
      return;
    }

    addProductToCart(code);
  }

  function addProductToCart(code, qty) {
    qty = qty || 1;
    const prod = db[code];
    if (!prod) return;

    const stock = Number(prod.stock || 0);
    if (stock <= 0) { alert(`Producto agotado: ${prod.name}`); return; }

    const existing = cart.find(i => i.code === code);
    const currentQty = existing ? existing.qty : 0;

    if (currentQty + qty > stock) {
      alert(`Stock insuficiente de "${prod.name}". Disponible: ${stock}`);
      return;
    }

    if (existing) existing.qty += qty;
    else cart.push({ code, name: prod.name, price: Number(prod.price || 0), qty });

    renderCart();
  }

  function saveNewProd() {
    if (!pendingCode) return;

    const name = document.getElementById('newProdName').value.trim();
    const price = parseFloat(document.getElementById('newProdPrice').value);
    const stock = parseInt(document.getElementById('newProdStock').value, 10);

    if (!name) { alert('Escribe el nombre del producto.'); return; }
    if (isNaN(price) || price < 0) { alert('Precio inválido.'); return; }
    if (isNaN(stock) || stock < 0) { alert('Stock inválido.'); return; }

    db[pendingCode] = { name, price, stock };
    saveDB();
    updateCatCount();
    closeModal('newProdModal');

    const codeToAdd = pendingCode;
    pendingCode = null;
    addProductToCart(codeToAdd);
  }

  /* =========================================================
     CARRITO
  ========================================================= */

  function renderCart() {
    const list = document.getElementById('cartList');
    if (!list) return;

    if (cart.length === 0) {
      list.innerHTML = '<div class="empty-message">Ticket vacío. Escanea o busca un producto.</div>';
    } else {
      list.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div style="flex:1; min-width:100px;">
            <div style="font-size:13px; font-weight:bold;">${escapeHtml(item.name)}</div>
            <div style="font-size:11px; color:var(--text-muted);">${formatMoney(item.price)} c/u</div>
          </div>
          <button class="cart-qty-btn" onclick="changeQty('${item.code}',-1)">-</button>
          <span style="min-width:20px; text-align:center; font-weight:bold;">${item.qty}</span>
          <button class="cart-qty-btn" onclick="changeQty('${item.code}',1)">+</button>
          <span style="font-weight:bold; min-width:60px; text-align:right;">${formatMoney(item.price * item.qty)}</span>
          <button class="cart-qty-btn" style="background:var(--rose);" onclick="removeFromCart('${item.code}')">✕</button>
        </div>
      `).join('');
    }

    const total = cart.reduce((s,i) => s + i.price * i.qty, 0);
    document.getElementById('totalText').innerText = formatMoney(total);
    calcChange();
  }

  function changeQty(code, delta) {
    const item = cart.find(i => i.code === code);
    if (!item) return;

    const stock = getStock(code);
    const newQty = item.qty + delta;

    if (newQty <= 0) { removeFromCart(code); return; }
    if (newQty > stock) { alert(`Stock insuficiente. Disponible: ${stock}`); return; }

    item.qty = newQty;
    renderCart();
  }

  function removeFromCart(code) {
    cart = cart.filter(i => i.code !== code);
    renderCart();
  }

  function clearCart() {
    if (cart.length && !confirm('¿Vaciar el ticket?')) return;
    cart = [];
    const payEl = document.getElementById('payInput');
    if (payEl) payEl.value = '';
    renderCart();
  }

  function calcChange() {
    const total = cart.reduce((s,i) => s + i.price * i.qty, 0);
    const payEl = document.getElementById('payInput');
    const pay = parseFloat(payEl ? payEl.value : 0) || 0;
    const changeEl = document.getElementById('changeText');
    if (!changeEl) return;
    const change = pay - total;
    changeEl.innerText = formatMoney(Math.max(change, 0));
    changeEl.style.color = change < 0 ? 'var(--rose)' : 'var(--emerald)';
  }

  /* =========================================================
     COBRO
  ========================================================= */

  function checkout() {
    if (cart.length === 0) { alert('El ticket está vacío.'); return; }

    const total = cart.reduce((s,i) => s + i.price * i.qty, 0);
    const payEl = document.getElementById('payInput');
    const pay = parseFloat(payEl.value) || 0;

    if (pay < total) { alert('El efectivo ingresado es menor al total.'); return; }

    for (const item of cart) {
      const stock = getStock(item.code);
      if (item.qty > stock) {
        alert(`Stock insuficiente de "${item.name}". Disponible: ${stock}`);
        return;
      }
    }

    cart.forEach(item => {
      db[item.code].stock = Number(db[item.code].stock) - item.qty;
    });
    saveDB();

    const sale = {
      id: Date.now(),
      date: todayKey(),
      time: new Date().toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' }),
      items: cart.map(i => ({ code:i.code, name:i.name, price:i.price, qty:i.qty })),
      total,
      pay,
      change: pay - total
    };

    sales.push(sale);
    saveSales();

    cart = [];
    payEl.value = '';
    renderCart();
    updateCatCount();
    updateCashSummary();

    alert(`Venta registrada. Cambio: ${formatMoney(sale.change)}`);
  }

  /* =========================================================
     CAJA DEL DÍA
  ========================================================= */

  function todaysSales() {
    const t = todayKey();
    return sales.filter(s => s.date === t);
  }

  function updateCashSummary() {
    const today = todaysSales();
    const revenue = today.reduce((s,sale) => s + sale.total, 0);
    const received = today.reduce((s,sale) => s + sale.pay, 0);

    const countEl = document.getElementById('salesCount');
    const cashEl = document.getElementById('cashTotal');
    const salesEl = document.getElementById('salesTotal');
    if (countEl) countEl.innerText = today.length;
    if (cashEl) cashEl.innerText = formatMoney(received);
    if (salesEl) salesEl.innerText = formatMoney(revenue);

    const summaryEl = document.getElementById('cashSummary');
    if (summaryEl) {
      summaryEl.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;"><span>Tickets:</span><strong>${today.length}</strong></div>
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;"><span>Efectivo recibido:</span><strong>${formatMoney(received)}</strong></div>
        <div style="display:flex; justify-content:space-between;"><span>Ventas totales:</span><strong style="color:var(--emerald);">${formatMoney(revenue)}</strong></div>
      `;
    }

    updateTodayLabel();
  }

  function renderSalesHistory() {
    const today = todaysSales();
    const container = document.getElementById('salesHistory');
    if (!container) return;

    if (today.length === 0) {
      container.innerHTML = '<div class="empty-message">Sin ventas registradas hoy.</div>';
      return;
    }

    container.innerHTML = today.slice().reverse().map(sale => {
      const itemsHtml = sale.items.map(i => `${i.qty}x ${escapeHtml(i.name)}`).join(', ');
      return `
        <div class="sale-row">
          <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted);">
            <span>${sale.time}</span><span>${formatMoney(sale.total)}</span>
          </div>
          <div style="font-size:11px; margin-top:3px;">${itemsHtml}</div>
        </div>
      `;
    }).join('');
  }

  function openCashRegister() {
    updateCashSummary();
    renderSalesHistory();
    openModal('cashModal');
  }

  function closeDay() {
    const today = todaysSales();

    if (today.length === 0) {
      if (!confirm('No hay ventas hoy. ¿Cerrar caja de todas formas?')) return;
    } else {
      if (!confirm(`¿Confirmas el corte de caja? Se archivarán ${today.length} ventas de hoy.`)) return;
    }

    const t = todayKey();
    sales = sales.filter(s => s.date !== t);
    saveSales();
    updateCashSummary();
    renderSalesHistory();
    closeModal('cashModal');
    alert('Corte de caja realizado.');
  }

  /* =========================================================
     ESCÁNER DE CÁMARA
  ========================================================= */

  function toggleCam() {
    try {
      if (isScanning) stopCam();
      else startCam();
    } catch (err) {
      const el = document.getElementById('camStatus');
      if (el) el.innerText = '⚠️ Error al alternar cámara: ' + err.message;
      console.error(err);
    }
  }

  function startCam() {
    if (typeof Html5Qrcode === 'undefined') {
      alert('No se pudo cargar la librería de cámara. Revisa tu conexión a internet e intenta de nuevo.');
      return;
    }

    const statusEl = document.getElementById('camStatus');
    const btn = document.getElementById('camToggleBtn');

    html5QrCode = new Html5Qrcode('reader', {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.QR_CODE
      ]
    });

    html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 250, height: 120 } },
      (decodedText) => { onScanSuccess(decodedText); },
      () => { /* ignorar errores de frame sin código */ }
    ).then(() => {
      isScanning = true;
      statusEl.innerText = '📷 Cámara Encendida — apunta al código';
      btn.innerText = 'Apagar Cámara';
    }).catch((err) => {
      console.error(err);
      statusEl.innerText = '⚠️ No se pudo acceder a la cámara';
      alert('No se pudo acceder a la cámara. Verifica los permisos del navegador.');
    });
  }

  function stopCam() {
    if (!html5QrCode) { isScanning = false; return; }

    html5QrCode.stop().then(() => {
      html5QrCode.clear();
      isScanning = false;
      document.getElementById('camStatus').innerText = '📷 Cámara Apagada';
      document.getElementById('camToggleBtn').innerText = 'Encender Cámara';
    }).catch(() => {
      isScanning = false;
    });
  }

  function onScanSuccess(code) {
    const now = Date.now();
    if (now - lastScanTime < 1500) return; // evita lecturas duplicadas
    lastScanTime = now;
    if (navigator.vibrate) navigator.vibrate(100);
    addToCartByCode(code);
  }

  function scanImage(input) {
    const file = input.files && input.files[0];
    if (!file) return;

    if (typeof Html5Qrcode === 'undefined') {
      alert('No se pudo cargar la librería de escaneo.');
      return;
    }

    const tempId = 'temp-scan-reader';
    let tempDiv = document.getElementById(tempId);
    if (!tempDiv) {
      tempDiv = document.createElement('div');
      tempDiv.id = tempId;
      tempDiv.style.display = 'none';
      document.body.appendChild(tempDiv);
    }

    const fileScanner = new Html5Qrcode(tempId);
    fileScanner.scanFile(file, true)
      .then((decodedText) => { addToCartByCode(decodedText); })
      .catch(() => { alert('No se detectó ningún código en la foto. Intenta de nuevo o escribe el código manualmente.'); })
      .finally(() => { input.value = ''; });
  }

</script>
