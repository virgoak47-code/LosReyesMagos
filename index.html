<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificador de Precios - POS Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería de escaneo de código de barras -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">

  <!-- Header -->
  <header class="text-center py-2 border-b border-zinc-800">
    <h1 class="font-bold text-base tracking-wider text-amber-400">PUNTO DE VENTA // VERIFICADOR</h1>
    <p class="text-[10px] text-zinc-500">Escanea el código de barras del producto</p>
  </header>

  <!-- Viewport de la Cámara -->
  <main class="space-y-4 my-auto">
    <div class="relative overflow-hidden rounded-2xl border-2 border-zinc-800 bg-zinc-900 shadow-2xl">
      <div id="reader" class="w-full"></div>
      
      <!-- Guía visual sobre el visor -->
      <div class="absolute inset-0 pointer-events-none border-2 border-dashed border-amber-500/40 rounded-2xl m-6"></div>
    </div>

    <!-- TARJETA DE RESULTADO / PRECIO -->
    <div id="result-card" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 transition-all duration-300">
      <div class="text-center space-y-1">
        <span id="prod-sku" class="text-[10px] font-mono text-zinc-500 block">CÓDIGO: ---</span>
        <h2 id="prod-name" class="font-bold text-lg text-zinc-100 leading-tight">Listo para escanear</h2>
        <p id="prod-desc" class="text-xs text-zinc-400">Apunta la cámara al código de barras</p>
        <div id="price-container" class="pt-2 hidden">
          <span class="text-3xl font-black text-amber-300 tracking-tight" id="prod-price">$0.00</span>
          <span class="text-xs text-zinc-500 block font-medium">MXN</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Botones de Control -->
  <footer class="space-y-2">
    <button onclick="toggleCamera()" id="btn-cam" class="w-full bg-amber-600 hover:bg-amber-500 active:scale-95 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-amber-950/50">
      Iniciar / Detener Cámara
    </button>
  </footer>

  <script>
    // ------------------------------------------------------------------
    // BASE DE DATOS DE PRODUCTOS (Llave = Código de Barras EAN/UPC)
    // ------------------------------------------------------------------
    const DB_PRODUCTOS = {
      "7501000123456": { name: "Coca-Cola Original 600ml", price: 18.00, desc: "Botella PET No Retornable" },
      "7501055300078": { name: "Papas Sabritas Sal 45g", price: 20.50, desc: "Botana de papa natural" },
      "7501020512345": { name: "Agua Ciel 1 Litro", price: 12.00, desc: "Agua purificada" }
    };

    let html5QrCode;
    let isScanning = false;

    // Sonido sintetizado para feedback de escaneo
    function playBeep() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880; // Tono A5
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    }

    function onScanSuccess(decodedText, decodedResult) {
      // Feedback hápitco y sonoro
      if (navigator.vibrate) navigator.vibrate(100);
      playBeep();

      const skuElement = document.getElementById('prod-sku');
      const nameElement = document.getElementById('prod-name');
      const descElement = document.getElementById('prod-desc');
      const priceElement = document.getElementById('prod-price');
      const priceContainer = document.getElementById('price-container');
      const card = document.getElementById('result-card');

      skuElement.innerText = `CÓDIGO: ${decodedText}`;

      if (DB_PRODUCTOS[decodedText]) {
        const item = DB_PRODUCTOS[decodedText];
        nameElement.innerText = item.name;
        descElement.innerText = item.desc;
        priceElement.innerText = `$${item.price.toFixed(2)}`;
        priceContainer.classList.remove('hidden');
        
        card.className = "bg-zinc-900 border-2 border-amber-500/80 rounded-2xl p-4 transition-all duration-300 shadow-lg shadow-amber-500/10";
      } else {
        nameElement.innerText = "Producto No Encontrado";
        descElement.innerText = "Este código no está registrado en la base de datos.";
        priceContainer.classList.add('hidden');
        
        card.className = "bg-zinc-900 border-2 border-red-500/80 rounded-2xl p-4 transition-all duration-300";
      }

      // Pausa momentánea para evitar múltiples lecturas seguidas
      html5QrCode.pause();
      setTimeout(() => { html5QrCode.resume(); }, 2000);
    }

    function toggleCamera() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      if (isScanning) {
        html5QrCode.stop().then(() => {
          isScanning = false;
          document.getElementById('btn-cam').innerText = "Iniciar Cámara";
        });
      } else {
        const config = { 
          fps: 10, 
          qrbox: { width: 250, height: 150 },
          aspectRatio: 1.0
        };

        // Solicita cámara trasera explícitamente
        html5QrCode.start(
          { facingMode: "environment" }, 
          config, 
          onScanSuccess
        ).then(() => {
          isScanning = true;
          document.getElementById('btn-cam').innerText = "Detener Cámara";
        }).catch(err => {
          alert("Error al acceder a la cámara: Asegúrate de usar HTTPS y dar permisos.");
        });
      }
    }
  </script>
</body>
</html>
