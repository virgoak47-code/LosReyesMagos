<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abarrotes Reyes Magos - POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    #reader video {
      object-fit: cover !important;
      border-radius: 0.75rem;
      width: 100% !important;
      max-height: 250px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-10">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🏪</span>
        <div>
          <h1 class="font-bold text-base text-amber-400 leading-tight">Abarrotes Reyes Magos</h1>
          <p class="text-[11px] text-slate-400">Control de Precios & Inventario Móvil</p>
        </div>
      </div>
      <div id="statusBadge" class="text-[11px] bg-slate-700 px-2.5 py-1 rounded-full text-slate-300 font-mono">0 Prod.</div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-4 space-y-4">

    <!-- Pestañas -->
    <nav class="grid grid-cols-4 bg-slate-800 p-1 rounded-xl border border-slate-700 text-xs font-medium gap-1">
      <button onclick="switchTab('scan')" id="tab-scan" class="py-2.5 text-center rounded-lg bg-amber-500 text-slate-950 font-bold">Escáner</button>
      <button onclick="switchTab('pos')" id="tab-pos" class="py-2.5 text-center rounded-lg hover:bg-slate-700 text-slate-300">Venta</button>
      <button onclick="switchTab('inventory')" id="tab-inventory" class="py-2.5 text-center rounded-lg hover:bg-slate-700 text-slate-300">Stock</button>
      <button onclick="switchTab('data')" id="tab-data" class="py-2.5 text-center rounded-lg hover:bg-slate-700 text-slate-300">Datos</button>
    </nav>

    <!-- SECCIÓN ESCÁNER -->
    <section id="sec-scan" class="space-y-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="font-semibold text-slate-200 text-xs uppercase tracking-wider">Cámara de Escaneo</h2>
          <button id="toggleCamBtn" onclick="toggleCamera()" class="px-3.5 py-2 bg-amber-500 text-slate-950 text-xs font-bold rounded-lg active:scale-95 transition">
            Encender Cámara
          </button>
        </div>
        
        <!-- Visor -->
        <div class="relative overflow-hidden rounded-xl border border-slate-700 bg-slate-950 min-h-[180px] flex items-center justify-center">
          <div id="reader" class="w-full"></div>
          <div id="scanner-placeholder" class="p-6 text-center text-xs text-slate-400 absolute">
            📷 Cámara apagada.<br>Toca "Encender Cámara" para comenzar.
          </div>
        </div>

        <!-- Búsqueda Manual -->
        <div class="flex gap-2">
          <input type="number" pattern="[0-9]*" id="manualBarcode" placeholder="Código de barras manual..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
          <button onclick="processBarcode(document.getElementById('manualBarcode').value.trim())" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-xs font-semibold text-slate-200 active:scale-95 transition">
            Buscar
          </button>
        </div>
      </div>

      <!-- Ficha de Producto -->
      <div id="productCard" class="hidden bg-slate-800 p-4 rounded-xl border border-amber-500/50 space-y-3">
        <div class="flex justify-between items-center">
          <span id="barcodeDisplay" class="text-xs font-mono bg-slate-900 px-2 py-1 rounded text-amber-400 border border-slate-700">0000000000000</span>
          <span id="sourceTag" class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-slate-700 text-slate-300">NUEVO</span>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Nombre del Producto</label>
          <input type="text" id="prodName" placeholder="Ej. Jabón Zote 400g" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Precio ($)</label>
            <input type="number" step="0.5" id="prodPrice" placeholder="0.00" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-emerald-400 font-bold focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Stock</label>
            <input type="number" id="prodStock" placeholder="0" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <button onclick="saveProduct()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-lg active:scale-95 transition text-xs">
          Guardar Producto
        </button>
      </div>
    </section>

    <!-- SECCIÓN VENTA -->
    <section id="sec-pos" class="hidden space-y-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
        <h2 class="font-bold text-slate-200 text-sm">Ticket de Venta</h2>
        <div id="cartList" class="space-y-2 text-xs text-slate-400">Sin productos.</div>
        <div class="border-t border-slate-700 pt-3 flex justify-between items-center">
          <span class="text-sm font-semibold">Total:</span>
          <span id="cartTotal" class="text-emerald-400 text-2xl font-black">$0.00</span>
        </div>
      </div>
    </section>

    <!-- SECCIÓN STOCK -->
    <section id="sec-inventory" class="hidden space-y-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
        <h2 class="font-bold text-slate-200 text-sm">Inventario Registrado</h2>
        <div id="inventoryList" class="space-y-2 text-xs"></div>
      </div>
    </section>

    <!-- SECCIÓN DATOS -->
    <section id="sec-data" class="hidden space-y-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
        <h2 class="font-bold text-slate-200 text-sm">Copias de Seguridad</h2>
        <button onclick="exportJSON()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-100 p-2.5 rounded-lg text-xs font-semibold">
          Exportar JSON
        </button>
      </div>
    </section>

  </main>

  <script>
    const DB_KEY = 'reyes_magos_db';
    let db = JSON.parse(localStorage.getItem(DB_KEY)) || {};
    let html5QrCode = null;
    let isScanning = false;
    let currentBarcode = null;

    document.addEventListener("DOMContentLoaded", () => {
      repairDB();
      updateBadge();
    });

    function repairDB() {
      let modified = false;
      Object.keys(db).forEach(code => {
        if (db[code].stock === undefined || db[code].stock === null || isNaN(db[code].stock)) {
          db[code].stock = 0;
          modified = true;
        }
      });
      if (modified) saveDB();
    }

    function saveDB() {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      updateBadge();
    }

    function updateBadge() {
      document.getElementById('statusBadge').innerText = `${Object.keys(db).length} Prod.`;
    }

    // LÓGICA DE CÁMARA DETECTANDO LENTES FÍSICOS
    async function toggleCamera() {
      if (typeof Html5Qrcode === 'undefined') {
        alert("Cargando librería... Espera unos segundos e intenta de nuevo.");
        return;
      }

      const btn = document.getElementById('toggleCamBtn');
      const placeholder = document.getElementById('scanner-placeholder');

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      if (isScanning) {
        try {
          await html5QrCode.stop();
          isScanning = false;
          btn.innerText = "Encender Cámara";
          btn.classList.replace("bg-rose-500", "bg-amber-500");
          placeholder.classList.remove('hidden');
        } catch (err) {}
      } else {
        try {
          // 1. Obtener la lista de cámaras físicas detectadas por Android
          const devices = await Html5Qrcode.getCameras();
          if (!devices || devices.length === 0) {
            alert("No se encontró ninguna cámara en el dispositivo.");
            return;
          }

          // 2. Buscar la cámara trasera principal por su nombre o tomar la última de la lista
          let backCam = devices.find(d => 
            d.label.toLowerCase().includes('back') || 
            d.label.toLowerCase().includes('rear') || 
            d.label.toLowerCase().includes('trasera')
          );

          if (!backCam) {
            backCam = devices[devices.length - 1]; // La última suele ser la trasera en Android
          }

          placeholder.classList.add('hidden');

          // 3. Encender pasando el ID exacto de la cámara
          await html5QrCode.start(
            backCam.id,
            { fps: 12, qrbox: { width: 240, height: 130 } },
            onScanSuccess
          );

          isScanning = true;
          btn.innerText = "Apagar Cámara";
          btn.classList.replace("bg-amber-500", "bg-rose-500");

        } catch (err) {
          placeholder.classList.remove('hidden');
          alert("Error de acceso a la cámara: " + (err.message || err) + "\n\nAsegúrate de otorgar permisos en Chrome.");
        }
      }
    }

    function onScanSuccess(decodedText) {
      if (navigator.vibrate) navigator.vibrate(60);
      processBarcode(decodedText);
    }

    function processBarcode(code) {
      if (!code) return;
      currentBarcode = code;
      document.getElementById('productCard').classList.remove('hidden');
      document.getElementById('barcodeDisplay').innerText = code;

      if (db[code]) {
        document.getElementById('prodName').value = db[code].name || '';
        document.getElementById('prodPrice').value = db[code].price || '';
        document.getElementById('prodStock').value = db[code].stock !== undefined ? db[code].stock : 0;
        document.getElementById('sourceTag').innerText = "REGISTRADO";
        document.getElementById('sourceTag').className = "text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-emerald-900 text-emerald-300";
      } else {
        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodStock').value = '10';
        document.getElementById('sourceTag').innerText = "NUEVO";
        document.getElementById('sourceTag').className = "text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-amber-900 text-amber-300";
      }
    }

    function saveProduct() {
      if (!currentBarcode) return;
      const name = document.getElementById('prodName').value.trim();
      const price = parseFloat(document.getElementById('prodPrice').value) || 0;
      const stock = parseInt(document.getElementById('prodStock').value) || 0;

      if (!name) return alert("Escribe un nombre");

      db[currentBarcode] = { name, price, stock };
      saveDB();
      document.getElementById('sourceTag').innerText = "GUARDADO";
      document.getElementById('sourceTag').className = "text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-emerald-900 text-emerald-300";
      alert("Producto guardado correctamente");
    }

    function switchTab(tab) {
      ['scan', 'pos', 'inventory', 'data'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = "py-2.5 text-center rounded-lg hover:bg-slate-700 text-slate-300";
      });
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = "py-2.5 text-center rounded-lg bg-amber-500 text-slate-950 font-bold";

      if (tab === 'inventory') renderInventory();
    }

    function renderInventory() {
      const container = document.getElementById('inventoryList');
      container.innerHTML = '';
      const keys = Object.keys(db);

      if (keys.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-center py-4">Sin productos guardados.</p>`;
        return;
      }

      keys.reverse().forEach(code => {
        const item = db[code];
        container.innerHTML += `
          <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800">
            <div>
              <p class="font-bold text-slate-200 text-xs">${item.name}</p>
              <p class="font-mono text-[10px] text-slate-500">${code}</p>
            </div>
            <div class="text-right">
              <p class="text-emerald-400 font-bold text-xs">$${(item.price || 0).toFixed(2)}</p>
              <p class="text-slate-400 text-[10px]">Stock: <span class="font-bold text-slate-200">${item.stock || 0}</span></p>
            </div>
          </div>
        `;
      });
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `inventario_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }
  </script>
</body>
</html>
