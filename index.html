<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abarrotes Reyes Magos - POS</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 1rem 0 4rem 0;
      min-height: 100vh;
    }
    .btn {
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-primary { background-color: #f59e0b; color: #020617; }
    .btn-primary:hover { background-color: #d97706; }
    .btn-success { background-color: #10b981; color: #020617; }
    .btn-success:hover { background-color: #059669; }
    .btn-secondary { background-color: #334155; color: #f8fafc; }
    .btn-secondary:hover { background-color: #475569; }
    .btn-danger { background-color: #9f1239; color: #fecdd3; }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    #reader video {
      object-fit: cover !important;
      border-radius: 0.5rem;
      width: 100% !important;
      max-height: 220px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="max-w-xl mx-auto px-4 mb-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🏪</span>
      <div>
        <h1 class="font-bold text-base text-amber-400 leading-tight">Abarrotes Reyes Magos</h1>
        <p class="text-[11px] text-slate-400">Punto de Venta <span class="text-emerald-400 font-bold">[v4.4 Final]</span></p>
      </div>
    </div>
    <button type="button" onclick="openInventoryModal()" id="statusBadge" class="btn btn-secondary text-xs">
      0 Prod.
    </button>
  </header>

  <main class="max-w-xl mx-auto px-4 space-y-4">

    <!-- LECTOR Y CÁMARA -->
    <div class="card space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold text-slate-200 text-xs uppercase tracking-wider">Escáner / Entrada</h2>
        <button type="button" id="toggleCamBtn" onclick="toggleCamera()" class="btn btn-primary">
          Encender Cámara
        </button>
      </div>
      
      <div class="relative overflow-hidden rounded-xl border border-slate-700 bg-slate-950 min-h-[160px] flex items-center justify-center">
        <div id="reader" class="w-full min-h-[160px]"></div>
        <div id="scanner-placeholder" class="p-4 text-center text-xs text-slate-400 absolute">
          📷 Cámara apagada.
        </div>
      </div>

      <!-- Foto Nativa -->
      <div class="flex gap-2">
        <label class="btn btn-secondary flex-1 cursor-pointer text-center text-xs">
          📷 Capturar Foto de Código
          <input type="file" id="fileQrInput" accept="image/*" capture="environment" class="hidden" onchange="scanImageFile(this)">
        </label>
      </div>

      <!-- Entrada Manual (Sin tag <form> para evitar recargas) -->
      <div class="flex gap-2 pt-1">
        <input type="text" inputmode="numeric" id="manualBarcodeScan" 
               placeholder="Escribir código de barras..." 
               onkeydown="if(event.key === 'Enter') runManualSearch()"
               class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
        <button type="button" onclick="runManualSearch()" class="btn btn-primary">
          + Agregar
        </button>
      </div>
    </div>

    <!-- TICKET DE VENTA -->
    <div class="card space-y-3 shadow-lg">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <h2 class="font-bold text-slate-200 text-sm">🛒 Ticket de Compra</h2>
        <button type="button" onclick="clearCart()" class="text-[11px] bg-slate-700 px-2 py-1 rounded text-rose-300 font-semibold">
          Vaciar Ticket
        </button>
      </div>

      <div id="cartList" class="space-y-2 text-xs divide-y divide-slate-700/50 min-h-[60px]">
        <p class="text-slate-500 text-center py-4">Escanea o ingresa productos.</p>
      </div>

      <div class="border-t-2 border-slate-700 pt-3 space-y-3">
        <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800">
          <span class="text-sm font-bold text-slate-300 uppercase">Total:</span>
          <span id="cartTotal" class="text-emerald-400 text-3xl font-black font-mono">$0.00</span>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Efectivo ($)</label>
            <input type="number" step="any" id="payAmount" oninput="calculateChange()" placeholder="0.00" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-base text-slate-100 font-bold focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Cambio ($)</label>
            <div id="changeAmount" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-base font-bold text-slate-500 flex items-center font-mono">
              $0.00
            </div>
          </div>
        </div>

        <button type="button" onclick="completeSale()" class="w-full btn btn-success py-3.5 text-sm uppercase tracking-wider">
          ✓ Finalizar y Cobrar
        </button>
      </div>
    </div>

    <!-- ADMINISTRACIÓN -->
    <div class="card flex justify-between items-center">
      <span class="text-xs text-slate-400 font-semibold">Inventario:</span>
      <button type="button" onclick="openInventoryModal()" class="btn btn-primary">
        📋 Catálogo Completo
      </button>
    </div>

  </main>

  <!-- MODAL: NUEVO PRODUCTO -->
  <div id="newProductModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-amber-500/50 rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-2xl">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-amber-400 text-sm">📦 Producto No Registrado</h3>
        <button type="button" onclick="closeNewProductModal()" class="text-slate-400 text-xs font-bold">✕</button>
      </div>

      <p class="text-xs text-slate-300">Código: <span id="modalBarcode" class="font-mono bg-slate-900 px-2 py-0.5 rounded text-amber-300"></span></p>

      <div>
        <label class="block text-xs text-slate-400 mb-1">Nombre del Producto</label>
        <input type="text" id="newProdName" placeholder="Ej. Sabritas Sal 45g" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Precio Venta ($)</label>
          <input type="number" step="any" id="newProdPrice" placeholder="0.00" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-emerald-400 font-bold">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Stock</label>
          <input type="number" id="newProdStock" value="10" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">
        </div>
      </div>

      <button type="button" onclick="saveAndAddProduct()" class="w-full btn btn-primary py-2.5 uppercase">
        Guardar y Sumar
      </button>
    </div>
  </div>

  <!-- MODAL: CATÁLOGO COMPLETO -->
  <div id="inventoryModal" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 w-full max-w-md h-[80vh] flex flex-col space-y-3">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <div>
          <h3 class="font-bold text-amber-400 text-base">📋 Catálogo de Productos</h3>
          <p class="text-[11px] text-slate-400" id="invTotalCount">0 productos</p>
        </div>
        <button type="button" onclick="closeInventoryModal()" class="text-slate-400 text-lg font-bold">✕</button>
      </div>

      <input type="text" id="invSearchInput" oninput="renderInventoryList()" placeholder="🔍 Buscar por nombre o código..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none">

      <div id="inventoryModalList" class="flex-1 overflow-y-auto space-y-2 divide-y divide-slate-700/40 pr-1"></div>

      <button type="button" onclick="closeInventoryModal()" class="w-full btn btn-secondary uppercase">
        Cerrar
      </button>
    </div>
  </div>

  <script>
    const DB_KEY = 'reyes_magos_db_v4';
    let db = {};
    let cart = [];
    let html5QrCode = null;
    let isScanning = false;
    let pendingBarcode = null;
    let lastScannedCode = null;
    let lastScanTime = 0;

    document.addEventListener("DOMContentLoaded", () => {
      try {
        db = JSON.parse(localStorage.getItem(DB_KEY)) || {};
      } catch(e) { 
        db = {}; 
      }
      updateBadge();
      renderCart();
    });

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(900, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch(e) {}
    }

    function saveDB() {
      try { 
        localStorage.setItem(DB_KEY, JSON.stringify(db)); 
      } catch(e) {}
      updateBadge();
    }

    function updateBadge() {
      const count = Object.keys(db).length;
      const badge = document.getElementById('statusBadge');
      if (badge) badge.innerText = `${count} Prod.`;
      const invCount = document.getElementById('invTotalCount');
      if (invCount) invCount.innerText = `${count} producto(s) en catálogo`;
    }

    function runManualSearch() {
      const input = document.getElementById('manualBarcodeScan');
      if (!input) return;
      const code = input.value.trim();
      if (!code) return;
      processBarcode(code, false);
      input.value = '';
    }

    function processBarcode(code, isFromCamera = false) {
      if (!code) return;

      const now = Date.now();
      // Anti-bounce SOLO para la cámara en vivo
      if (isFromCamera && code === lastScannedCode && (now - lastScanTime) < 1800) {
        return;
      }
      lastScannedCode = code;
      lastScanTime = now;

      if (db[code]) {
        addToCart(code);
      } else {
        pendingBarcode = code;
        document.getElementById('modalBarcode').innerText = code;
        document.getElementById('newProdName').value = '';
        document.getElementById('newProdPrice').value = '';
        document.getElementById('newProdStock').value = '10';
        document.getElementById('newProductModal').classList.remove('hidden');
        
        setTimeout(() => {
          document.getElementById('newProdName').focus();
        }, 150);
      }
    }

    async function stopCamera() {
      const btn = document.getElementById('toggleCamBtn');
      const placeholder = document.getElementById('scanner-placeholder');

      if (html5QrCode && isScanning) {
        try {
          await html5QrCode.stop();
        } catch (err) {}
        isScanning = false;
      }
      if (btn) {
        btn.innerText = "Encender Cámara";
        btn.className = "btn btn-primary";
      }
      if (placeholder) placeholder.style.display = 'block';
    }

    async function toggleCamera() {
      if (typeof Html5Qrcode === 'undefined') {
        return alert("Error de conexión al cargar la librería de escáner.");
      }

      if (isScanning) {
        await stopCamera();
        return;
      }

      const btn = document.getElementById('toggleCamBtn');
      const placeholder = document.getElementById('scanner-placeholder');

      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        }

        if (placeholder) placeholder.style.display = 'none';

        const config = { 
          fps: 15, 
          qrbox: (viewfinderWidth, viewfinderHeight) => {
            const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
            return {
              width: Math.floor(minEdge * 0.8),
              height: Math.floor(minEdge * 0.45)
            };
          }
        };

        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          (decodedText) => {
            playBeep();
            processBarcode(decodedText, true);
          },
          () => {}
        );

        isScanning = true;
        btn.innerText = "Apagar Cámara";
        btn.className = "btn btn-danger";
      } catch (err) {
        if (placeholder) placeholder.style.display = 'block';
        alert("Asegúrate de otorgar permisos de cámara al navegador.");
      }
    }

    async function scanImageFile(input) {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];

      await stopCamera();

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      try {
        const decodedText = await html5QrCode.scanFile(file, true);
        playBeep();
        processBarcode(decodedText, false);
      } catch (err) {
        alert("No se detectó un código claro. Intenta con una toma con más luz y nitidez.");
      } finally {
        input.value = '';
      }
    }

    function saveAndAddProduct() {
      if (!pendingBarcode) return;
      const name = document.getElementById('newProdName').value.trim();
      const price = parseFloat(document.getElementById('newProdPrice').value);
      const stock = parseInt(document.getElementById('newProdStock').value) || 0;

      if (!name || isNaN(price) || price <= 0) {
        return alert("Ingresa un nombre y precio válidos.");
      }

      db[pendingBarcode] = { name, price, stock };
      saveDB();
      addToCart(pendingBarcode);
      closeNewProductModal();
    }

    function closeNewProductModal() {
      document.getElementById('newProductModal').classList.add('hidden');
      pendingBarcode = null;
    }

    function openInventoryModal() {
      document.getElementById('inventoryModal').classList.remove('hidden');
      renderInventoryList();
    }

    function closeInventoryModal() {
      document.getElementById('inventoryModal').classList.add('hidden');
    }

    function renderInventoryList() {
      const container = document.getElementById('inventoryModalList');
      const query = (document.getElementById('invSearchInput').value || '').toLowerCase().trim();
      if (!container) return;
      container.innerHTML = '';

      const keys = Object.keys(db);
      if (keys.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-center py-6">Catálogo vacío.</p>`;
        return;
      }

      keys.reverse().forEach(code => {
        const item = db[code];
        if (query && !item.name.toLowerCase().includes(query) && !code.includes(query)) return;

        container.innerHTML += `
          <div class="pt-2 pb-1 flex justify-between items-center">
            <div>
              <p class="font-bold text-slate-100 text-xs">${item.name}</p>
              <p class="font-mono text-[10px] text-slate-400">${code}</p>
            </div>
            <div class="text-right flex items-center gap-2">
              <div>
                <p class="text-emerald-400 font-bold text-xs">$${item.price.toFixed(2)}</p>
                <p class="text-[10px] text-slate-400">Stock: ${item.stock}</p>
              </div>
              <button type="button" onclick="editProductPrompt('${code}')" class="bg-slate-700 p-1.5 rounded text-amber-400 text-xs">✏️</button>
            </div>
          </div>
        `;
      });
    }

    function editProductPrompt(code) {
      const item = db[code];
      if (!item) return;
      const newName = prompt("Editar nombre:", item.name);
      if (newName === null) return;
      const newPrice = prompt("Editar precio ($):", item.price);
      if (newPrice === null) return;
      const newStock = prompt("Editar stock:", item.stock);
      if (newStock === null) return;

      db[code] = {
        name: newName.trim() || item.name,
        price: parseFloat(newPrice) || 0,
        stock: parseInt(newStock) || 0
      };

      saveDB();
      renderInventoryList();
      renderCart();
    }

    function addToCart(code) {
      const prod = db[code];
      if (!prod) return;

      const idx = cart.findIndex(item => item.code === code);
      if (idx > -1) {
        cart[idx].qty += 1;
      } else {
        cart.push({ code, name: prod.name, price: prod.price, qty: 1 });
      }
      renderCart();
    }

    function updateQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      renderCart();
    }

    function clearCart() {
      cart = [];
      document.getElementById('payAmount').value = '';
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cartList');
      if (!container) return;
      container.innerHTML = '';
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-center py-4">Escanea o ingresa productos.</p>`;
        document.getElementById('cartTotal').innerText = '$0.00';
        calculateChange();
        return;
      }

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;

        container.innerHTML += `
          <div class="flex justify-between items-center pt-2">
            <div>
              <p class="font-bold text-slate-100 text-xs">${item.name}</p>
              <p class="text-emerald-400 font-mono text-[11px]">$${item.price.toFixed(2)} x ${item.qty} = $${itemTotal.toFixed(2)}</p>
            </div>
            <div class="flex items-center gap-2">
              <button type="button" onclick="updateQty(${index}, -1)" class="w-6 h-6 bg-slate-700 text-slate-200 rounded font-bold">-</button>
              <span class="font-mono text-xs font-bold">${item.qty}</span>
              <button type="button" onclick="updateQty(${index}, 1)" class="w-6 h-6 bg-slate-700 text-slate-200 rounded font-bold">+</button>
            </div>
          </div>
        `;
      });

      document.getElementById('cartTotal').innerText = `$${total.toFixed(2)}`;
      calculateChange();
    }

    function calculateChange() {
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const pay = parseFloat(document.getElementById('payAmount').value) || 0;
      const changeDisplay = document.getElementById('changeAmount');

      if (!changeDisplay) return;

      if (total === 0) {
        changeDisplay.innerText = "$0.00";
        changeDisplay.className = "w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-base font-bold text-slate-500 font-mono";
        return;
      }

      const change = pay - total;
      if (pay >= total) {
        changeDisplay.innerText = `$${change.to
