<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abarrotes Reyes Magos - POS</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js" onerror="window.camLibFailed=true"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --amber: #f59e0b;
      --emerald: #10b981;
      --rose: #e11d48;
      --blue: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --orange: #f97316;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      max-width: 500px;
      margin: 0 auto;
      padding-bottom: 50px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      color: var(--amber);
    }

    .version {
      font-size: 10px;
      color: var(--emerald);
      font-weight: bold;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .btn-amber {
      background: var(--amber);
      color: #000;
    }

    .btn-emerald {
      background: var(--emerald);
      color: #000;
    }

    .btn-slate {
      background: #334155;
      color: #fff;
    }

    .btn-rose {
      background: var(--rose);
      color: #fff;
    }

    .btn-blue {
      background: var(--blue);
      color: #fff;
    }

    .btn-orange {
      background: var(--orange);
      color: #fff;
    }

    .input {
      width: 100%;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .input:focus {
      border-color: var(--amber);
    }

    .scanner-container {
      background: #020617;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }

    #reader {
      width: 100%;
      min-height: 120px;
      border-radius: 6px;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      max-height: 200px;
      object-fit: cover;
    }

    .flex-gap {
      display: flex;
      gap: 8px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      gap: 8px;
    }

    .cart-qty-btn {
      width: 28px;
      height: 28px;
      background: var(--border);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .hidden {
      display: none !important;
    }

    .stock-ok {
      color: var(--emerald);
    }

    .stock-low {
      color: var(--amber);
      font-weight: bold;
    }

    .stock-out {
      color: var(--rose);
      font-weight: bold;
    }

    .product-row {
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }

    .product-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .product-actions {
      display: flex;
      gap: 5px;
      margin-top: 7px;
    }

    .small-btn {
      border: none;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .quick-search {
      margin-top: 10px;
    }

    .quick-product {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px;
      margin-top: 6px;
      cursor: pointer;
    }

    .quick-product:active {
      transform: scale(0.98);
    }

    .badge {
      display: inline-block;
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 9px;
      font-weight: bold;
    }

    .badge-green {
      background: rgba(16,185,129,.15);
      color: var(--emerald);
    }

    .badge-yellow {
      background: rgba(245,158,11,.15);
      color: var(--amber);
    }

    .badge-red {
      background: rgba(225,29,72,.15);
      color: var(--rose);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .stat {
      background: #020617;
      border-radius: 8px;
      padding: 10px 5px;
      text-align: center;
    }

    .stat-value {
      font-size: 17px;
      font-weight: 900;
      color: var(--emerald);
      font-family: monospace;
    }

    .stat-label {
      font-size: 8px;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: bold;
    }

    .sale-row {
      background: #020617;
      border-radius: 8px;
      padding: 9px;
      margin-bottom: 7px;
      border: 1px solid rgba(255,255,255,.05);
    }

    .empty-message {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      padding: 15px 0;
    }

    @media (max-width: 360px) {
      .header {
        align-items: flex-start;
      }

      .title {
        font-size: 14px;
      }

      .stat-value {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- ENCABEZADO -->
  <div class="header">
    <div>
      <div class="title">🏪 Abarrotes Reyes Magos</div>
      <div class="version">Punto de Venta [v6.0 Inventario]</div>
    </div>

    <button
      class="btn btn-slate"
      style="width:auto; padding:6px 10px; font-size:11px;"
      onclick="openInventory()">
      📋 Catálogo (<span id="catCount">0</span>)
    </button>
  </div>


  <!-- ESCÁNER / ENTRADA -->
  <div class="card">

    <div class="card-title">
      <span>Escáner / Entrada</span>

      <button
        id="camToggleBtn"
        class="btn btn-amber"
        style="width:auto; padding:6px 10px; font-size:11px;"
        onclick="toggleCam()">
        Encender Cámara
      </button>
    </div>

    <div class="scanner-container">

      <div
        id="camStatus"
        style="font-size:12px; color:var(--text-muted); margin-bottom:4px;">
        📷 Cámara Apagada
      </div>

      <div id="reader"></div>

    </div>

    <div class="flex-gap" style="margin-bottom:10px;">

      <label
        class="btn btn-slate"
        style="font-size:11px; cursor:pointer;">

        📷 Capturar Foto de Código

        <input
          type="file"
          accept="image/*"
          capture="environment"
          style="display:none;"
          onchange="scanImage(this)">

      </label>

    </div>

    <div class="flex-gap">

      <input
        type="text"
        id="manualCode"
        class="input"
        placeholder="Escribir código de barras..."
        inputmode="numeric"
        onkeydown="if(event.key==='Enter') addManual()">

      <button
        class="btn btn-amber"
        style="width:100px;"
        onclick="addManual()">
        + Agregar
      </button>

    </div>


    <!-- BUSCADOR RÁPIDO -->
    <div class="quick-search">

      <input
        type="text"
        id="quickSearch"
        class="input"
        placeholder="🔎 Buscar producto por nombre..."
        oninput="renderQuickSearch()">

      <div id="quickResults"></div>

    </div>

  </div>


  <!-- TICKET -->
  <div class="card">

    <div class="card-title">

      <span>🛒 Ticket de Compra</span>

      <button
        class="btn btn-rose"
        style="width:auto; padding:4px 8px; font-size:10px;"
        onclick="clearCart()">
        Vaciar
      </button>

    </div>

    <div
      id="cartList"
      style="min-height:60px; margin-bottom:10px;">
    </div>


    <!-- TOTAL -->
    <div
      style="
        background:#020617;
        padding:12px;
        border-radius:8px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:10px;">

      <span style="font-size:12px; font-weight:bold;">
        TOTAL:
      </span>

      <span
        id="totalText"
        style="
          font-size:26px;
          font-weight:900;
          color:var(--emerald);
          font-family:monospace;">
        $0.00
      </span>

    </div>


    <!-- PAGO / CAMBIO -->
    <div class="grid-2" style="margin-bottom:10px;">

      <div>

        <label
          style="
            font-size:10px;
            color:var(--text-muted);
            font-weight:bold;
            display:block;
            margin-bottom:4px;">
          EFECTIVO ($)
        </label>

        <input
          type="number"
          id="payInput"
          class="input"
          placeholder="0.00"
          oninput="calcChange()">

      </div>


      <div>

        <label
          style="
            font-size:10px;
            color:var(--text-muted);
            font-weight:bold;
            display:block;
            margin-bottom:4px;">
          CAMBIO ($)
        </label>

        <div
          id="changeText"
          style="
            background:#020617;
            border:1px solid var(--border);
            border-radius:8px;
            padding:10px;
            font-weight:bold;
            font-family:monospace;
            font-size:14px;
            color:var(--text-muted);">
          $0.00
        </div>

      </div>

    </div>


    <button
      class="btn btn-emerald"
      style="padding:12px;"
      onclick="checkout()">
      ✓ FINALIZAR Y COBRAR
    </button>

  </div>


  <!-- BOTÓN CORTE DE CAJA -->
  <div class="card">

    <div class="card-title">
      <span>💰 Caja del Día</span>
      <span
        id="todayLabel"
        style="font-size:9px;">
      </span>
    </div>

    <div class="stat-grid">

      <div class="stat">
        <div
          id="salesCount"
          class="stat-value">
          0
        </div>
        <div class="stat-label">
          TICKETS
        </div>
      </div>

      <div class="stat">
        <div
          id="cashTotal"
          class="stat-value">
          $0
        </div>
        <div class="stat-label">
          EFECTIVO
        </div>
      </div>

      <div class="stat">
        <div
          id="salesTotal"
          class="stat-value">
          $0
        </div>
        <div class="stat-label">
          VENTAS
        </div>
      </div>

    </div>

    <button
      class="btn btn-blue"
      style="margin-top:10px;"
      onclick="openCashRegister()">
      🧾 Ver Ventas y Corte de Caja
    </button>

  </div>


  <!-- MODAL NUEVO PRODUCTO -->
  <div
    id="newProdModal"
    class="modal hidden">

    <div class="modal-content">

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;">

        <strong
          style="
            color:var(--amber);
            font-size:14px;">
          📦 Producto No Registrado
        </strong>

        <button
          onclick="closeModal('newProdModal')"
          style="
            background:none;
            border:none;
            color:#fff;
            font-weight:bold;">
          ✕
        </button>

      </div>


      <div
        style="
          font-size:11px;
          color:var(--text-muted);">
        Código:
        <span
          id="modalCode"
          style="
            color:var(--amber);
            font-family:monospace;">
        </span>
      </div>


      <input
        type="text"
        id="newProdName"
        class="input"
        placeholder="Nombre del Producto">


      <div class="grid-2">

        <input
          type="number"
          step="any"
          id="newProdPrice"
          class="input"
          placeholder="Precio $">

        <input
          type="number"
          min="0"
          id="newProdStock"
          class="input"
          placeholder="Stock"
          value="10">

      </div>


      <button
        class="btn btn-amber"
        onclick="saveNewProd()">
        Guardar y Sumar
      </button>

    </div>
  </div>


  <!-- MODAL CATÁLOGO -->
  <div
    id="catModal"
    class="modal hidden">

    <div
      class="modal-content">

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;">

        <strong style="color:var(--amber);">
          📋 Catálogo de Productos
        </strong>

        <button
          onclick="closeModal('catModal')"
          style="
            background:none;
            border:none;
            color:#fff;
            font-weight:bold;">
          ✕
        </button>

      </div>


      <input
        type="text"
        id="catSearch"
        class="input"
        placeholder="🔍 Buscar producto..."
        oninput="renderCat()">


      <div
        id="catList"
        style="
          flex:1;
          overflow-y:auto;
          max-height:400px;">
      </div>


      <button
        class="btn btn-slate"
        onclick="closeModal('catModal')">
        Cerrar
      </button>

    </div>
  </div>


  <!-- MODAL EDITAR PRODUCTO -->
  <div
    id="editProdModal"
    class="modal hidden">

    <div class="modal-content">

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;">

        <strong style="color:var(--amber);">
          ✏️ Editar Producto
        </strong>

        <button
          onclick="closeModal('editProdModal')"
          style="
            background:none;
            border:none;
            color:#fff;
            font-weight:bold;">
          ✕
        </button>

      </div>


      <div
        style="
          font-size:11px;
          color:var(--text-muted);">
        Código:
        <span
          id="editProdCode"
          style="
            color:var(--amber);
            font-family:monospace;">
        </span>
      </div>


      <input
        type="text"
        id="editProdName"
        class="input"
        placeholder="Nombre">


      <input
        type="number"
        step="any"
        id="editProdPrice"
        class="input"
        placeholder="Precio">


      <input
        type="number"
        min="0"
        id="editProdStock"
        class="input"
        placeholder="Stock">


      <button
        class="btn btn-emerald"
        onclick="saveEditProd()">
        ✓ Guardar Cambios
      </button>

    </div>
  </div>


  <!-- MODAL CAJA -->
  <div
    id="cashModal"
    class="modal hidden">

    <div
      class="modal-content">

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;">

        <strong style="color:var(--amber);">
          🧾 Ventas del Día
        </strong>

        <button
          onclick="closeModal('cashModal')"
          style="
            background:none;
            border:none;
            color:#fff;
            font-weight:bold;">
          ✕
        </button>

      </div>


      <div
        id="cashSummary"
        style="
          background:#020617;
          border-radius:8px;
          padding:12px;">
      </div>


      <div
        id="salesHistory"
        style="
          max-height:350px;
          overflow-y:auto;">
      </div>


      <button
        class="btn btn-rose"
        onclick="closeDay()">
        🔒 Hacer Corte y Reiniciar Caja
      </button>


      <button
        class="btn btn-slate"
        onclick="closeModal('cashModal')">
        Cerrar
      </button>

    </div>
  </div>


<script>

  /* =========================================================
     BASE DE DATOS LOCAL
  ========================================================= */

  const DB_KEY = 'reyes_magos_v51';

  const SALES_KEY = 'reyes_magos_sales_v1';

  const LOW_STOCK = 3;


  let db = {};

  let cart = [];

  let sales = [];

  let scanner = null;

  let isScanning = false;

  let pendingCode = null;

  let editingCode = null;


  /* =========================================================
     INICIO
  ========================================================= */

  window.onload = function() {

    try {
      db = JSON.parse(localStorage.getItem(DB_KEY)) || {};
    } catch(e) {
      db = {};
    }


    try {
      sales = JSON.parse(localStorage.getItem(SALES_KEY)) || [];
    } catch(e) {
      sales = [];
    }


    updateCatCount();

    renderCart();

    updateCashSummary();

    updateTodayLabel();

    renderQuickSearch();

  };


  /* =========================================================
     UTILIDADES
  ========================================================= */

  function saveDB() {

    localStorage.setItem(
      DB_KEY,
      JSON.stringify(db)
    );

  }


  function saveSales() {

    localStorage.setItem(
      SALES_KEY,
      JSON.stringify(sales)
    );

  }


  function todayKey() {

    const d = new Date();

    const y = d.getFullYear();

    const m = String(d.getMonth() + 1).padStart(2,'0');

    const day = String(d.getDate()).padStart(2,'0');

    return `${y}-${m}-${day}`;

  }


  function formatMoney(value) {

    return `$${Number(value || 0).toFixed(2)}`;

  }


  function updateTodayLabel() {

    const el = document.getElementById('todayLabel');

    if (!el) return;

    const d = new Date();

    el.innerText =
      d.toLocaleDateString(
        'es-MX',
        {
          day:'2-digit',
          month:'short',
          year:'numeric'
        }
      );

  }


  /* =========================================================
     CATÁLOGO
  ========================================================= */

  function updateCatCount() {

    const el =
      document.getElementById('catCount');

    if (el)
      el.innerText =
        Object.keys(db).length;

  }


  function getStock(code) {

    if (!db[code]) return 0;

    return Number(db[code].stock || 0);

  }


  function stockBadge(stock) {

    stock = Number(stock || 0);

    if (stock <= 0) {

      return `
        <span class="badge badge-red">
          AGOTADO
        </span>
      `;

    }

    if (stock <= LOW_STOCK) {

      return `
        <span class="badge badge-yellow">
          STOCK BAJO: ${stock}
        </span>
      `;

    }

    return `
      <span class="badge badge-green">
        STOCK: ${stock}
      </span>
    `;

  }


  /* =========================================================
     AGREGAR PRODUCTO POR CÓDIGO
  ========================================================= */

  function addManual() {

    const input =
      document.getElementById('manualCode');

    if (!input) return;

    const
