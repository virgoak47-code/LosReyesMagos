<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abarrotes Reyes Magos - POS Pro</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --amber: #f59e0b;
      --emerald: #10b981;
      --rose: #e11d48;
      --sky: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; max-width: 500px; margin: 0 auto; padding-bottom: 50px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .title { font-size: 16px; font-weight: bold; color: var(--amber); }
    .version { font-size: 10px; color: var(--emerald); font-weight: bold; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .card-title { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    
    .btn { width: 100%; padding: 10px 14px; border-radius: 8px; border: none; font-weight: bold; font-size: 13px; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
    .btn-amber { background: var(--amber); color: #000; }
    .btn-emerald { background: var(--emerald); color: #000; }
    .btn-slate { background: #334155; color: #fff; }
    .btn-rose { background: var(--rose); color: #fff; }
    .btn-sky { background: var(--sky); color: #fff; }
    .btn-xs { padding: 4px 8px; font-size: 10px; width: auto; }
    
    .input { width: 100%; background: #020617; border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: #fff; font-size: 14px; outline: none; }
    .input:focus { border-color: var(--amber); }
    
    .scanner-container { background: #020617; border-radius: 8px; padding: 8px; text-align: center; margin-bottom: 10px; border: 1px solid var(--border); }
    #reader { width: 100%; min-height: 100px; border-radius: 6px; overflow: hidden; }
    #reader video { width: 100% !important; max-height: 180px; object-fit: cover; }
    
    .flex-gap { display: flex; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .cart-qty-btn { width: 28px; height: 28px; background: var(--border); color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 380px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .hidden { display: none !important; }

    .badge-stock { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .stock-ok { background: rgba(16, 185, 129, 0.2); color: var(--emerald); }
    .stock-low { background: rgba(225, 29, 72, 0.2); color: var(--rose); }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="title">🏪 Abarrotes Reyes Magos</div>
      <div class="version">Punto de Venta [v6.1 Pro]</div>
    </div>
    <div class="flex-gap">
      <button class="btn btn-sky btn-xs" onclick="openCutModal()">📊 Corte</button>
      <button class="btn btn-slate btn-xs" onclick="openInventory()">📋 Catálogo (<span id="catCount">0</span>)</button>
    </div>
  </div>

  <!-- SECCIÓN CÁMARA Y ENTRADA -->
  <div class="card">
    <div class="card-title">
      <span>Escáner / Entrada</span>
      <button id="camToggleBtn" class="btn btn-amber btn-xs" onclick="toggleCam()">Encender Cámara</button>
    </div>

    <div class="scanner-container">
      <div id="camStatus" style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">📷 Cámara Apagada</div>
      <div id="reader"></div>
    </div>

    <div class="flex-gap" style="margin-bottom: 10px;">
      <label class="btn btn-slate" style="font-size: 11px; cursor: pointer;">
        📷 Subir / Capturar Foto de Código
        <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="scanImage(this)">
      </label>
    </div>

    <div class="flex-gap">
      <input type="text" id="manualCode" class="input" placeholder="Escribir código de barras..." inputmode="numeric" onkeydown="if(event.key==='Enter') addManual()">
      <button class="btn btn-amber" style="width: 100px;" onclick="addManual()">+ Agregar</button>
    </div>
  </div>

  <!-- TICKET DE COMPRA -->
  <div class="card">
    <div class="card-title">
      <span>🛒 Ticket de Compra</span>
      <button class="btn btn-rose btn-xs" onclick="clearCart()">Vaciar</button>
    </div>

    <div id="cartList" style="min-height: 60px; margin-bottom: 10px;">
      <div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 15px 0;">Escanea o ingresa un código.</div>
    </div>

    <div style="background: #020617; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <span style="font-size: 12px; font-weight: bold;">TOTAL:</span>
      <span id="totalText" style="font-size: 26px; font-weight: 900; color: var(--emerald); font-family: monospace;">$0.00</span>
    </div>

    <div class="grid-2" style="margin-bottom: 10px;">
      <div>
        <label style="font-size: 10px; color: var(--text-muted); font-weight: bold; display: block; margin-bottom: 4px;">EFECTIVO ($)</label>
        <input type="number" id="payInput" class="input" placeholder="0.00" oninput="calcChange()">
      </div>
      <div>
        <label style="font-size: 10px; color: var(--text-muted); font-weight: bold; display: block; margin-bottom: 4px;">CAMBIO ($)</label>
        <div id="changeText" style="background: #020617; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-weight: bold; font-family: monospace; font-size: 14px; color: var(--text-muted);">
          $0.00
        </div>
      </div>
    </div>

    <button class="btn btn-emerald" style="padding: 12px;" onclick="checkout()">✓ FINALIZAR Y COBRAR</button>
  </div>

  <!-- MODAL NUEVO / EDITAR PRODUCTO -->
  <div id="prodModal" class="modal hidden">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong id="prodModalTitle" style="color: var(--amber); font-size: 14px;">📦 Producto</strong>
        <button onclick="closeModal('prodModal')" style="background:none; border:none; color:#fff; font-weight:bold; cursor:pointer;">✕</button>
      </div>
      <div style="font-size: 11px; color: var(--text-muted);">Código: <span id="modalCode" style="color: var(--amber); font-family: monospace;"></span></div>
      <input type="text" id="newProdName" class="input" placeholder="Nombre del Producto">
      <div class="grid-2">
        <div>
          <label style="font-size: 10px; color: var(--text-muted);">Precio ($)</label>
          <input type="number" step="any" id="newProdPrice" class="input" placeholder="0.00">
        </div>
        <div>
          <label style="font-size: 10px; color: var(--text-muted);">Stock Actual</label>
          <input type="number" id="newProdStock" class="input" placeholder="10">
        </div>
      </div>
      <button class="btn btn-amber" onclick="saveProd()">Guardar Producto</button>
    </div>
  </div>

  <!-- MODAL CATÁLOGO -->
  <div id="catModal" class="modal hidden">
    <div class="modal-content" style="max-height: 85vh;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="color: var(--amber);">📋 Catálogo de Productos</strong>
        <button onclick="closeModal('catModal')" style="background:none; border:none; color:#fff; font-weight:bold; cursor:pointer;">✕</button>
      </div>
      <input type="text" id="catSearch" class="input" placeholder="🔍 Buscar por nombre o código..." oninput="renderCat()">
      <div id="catList" style="flex:1; overflow-y:auto; max-height: 320px;"></div>
      <button class="btn btn-slate" onclick="closeModal('catModal')">Cerrar</button>
    </div>
  </div>

  <!-- MODAL CORTE DE CAJA -->
  <div id="cutModal" class="modal hidden">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="color: var(--sky);">📊 Corte de Caja del Día</strong>
        <button onclick="closeModal('cutModal')" style="background:none; border:none; color:#fff; font-weight:bold; cursor:pointer;">✕</button>
      </div>
      <div style="background: #020617; padding: 12px; border-radius: 8px; text-align: center;">
        <div style="font-size: 11px; color: var(--text-muted); font-weight: bold;">TOTAL VENDIDO</div>
        <div id="cutTotalText" style="font-size: 28px; font-weight: 900; color: var(--emerald); font-family: monospace;">$0.00</div>
        <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Ventas realizadas: <span id="cutCountText" style="color: #fff; font-weight: bold;">0</span></div>
      </div>
      <button class="btn btn-rose" onclick="resetDaySales()">⚠️ Realizar Cierre y Reiniciar Caja</button>
      <button class="btn btn-slate" onclick="closeModal('cutModal')">Cerrar</button>
    </div>
  </div>

  <script>
    const DB_KEY = 'reyes_magos_v61_db';
    const SALES_KEY = 'reyes_magos_v61_sales';
    
    let db = {}, sales = [], cart = [], html5QrCode = null, isScanning = false, editingCode = null;

    function setStatus(msg) {
      const el = document.getElementById('camStatus');
      if (el) el.innerText = msg;
    }

    window.onload = function() {
      try {
        db = JSON.parse(localStorage.getItem(DB_KEY)) || {};
        sales = JSON.parse(localStorage.getItem(SALES_KEY)) || [];
      } catch(e) { db = {}; sales = []; }
      updateCatCount();
      renderCart();
    };

    function updateCatCount() {
      const el = document.getElementById('catCount');
      if (el) el.innerText = Object.keys(db).length;
    }

    function addManual() {
      const input = document.getElementById('manualCode');
      if (!input) return;
      const code = input.value.trim();
      if (!code) return;
      processCode(code);
      input.value = '';
    }

    function processCode(code) {
      if (db[code]) {
        const prod = db[code];
        const idx = cart.findIndex(i => i.code === code);
        const currentInCart = idx > -1 ? cart[idx].qty : 0;

        if (currentInCart + 1 > prod.stock) {
          alert(`⚠️ Stock insuficiente. Solo quedan ${prod.stock} unidades de${prod.name}.`);
          return;
        }

        if (idx > -1) cart[idx].qty++;
        else cart.push({ code, name: prod.name, price: prod.price, qty: 1 });
        renderCart();
      } else {
        openEditModal(code, true);
      }
    }

    function openEditModal(code, isNew = false) {
      editingCode = code;
      document.getElementById('modalCode').innerText = code;
      document.getElementById('prodModalTitle').innerText = isNew ? "📦 Producto No Registrado" : "✏️ Editar Producto";
      
      if (isNew) {
        document.getElementById('newProdName').value = '';
        document.getElementById('newProdPrice').value = '';
        document.getElementById('newProdStock').value = '10';
      } else {
        document.getElementById('newProdName').value = db[code].name;
        document.getElementById('newProdPrice').value = db[code].price;
        document.getElementById('newProdStock').value = db[code].stock;
      }
      
      document.getElementById('prodModal').classList.remove('hidden');
    }

    function saveProd() {
      const name = document.getElementById('newProdName').value.trim();
      const price = parseFloat(document.getElementById('newProdPrice').value);
      const stock = parseInt(document.getElementById('newProdStock').value);

      if (!name || isNaN(price) || price <= 0 || isNaN(stock)) {
        return alert("Ingresa un nombre, precio válido y stock.");
      }

      const isNew = !db[editingCode];
      db[editingCode] = { name, price, stock };
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      updateCatCount();
      closeModal('prodModal');

      if (isNew) processCode(editingCode);
      if (!document.getElementById('catModal').classList.contains('hidden')) renderCat();
    }

    function deleteProd(code) {
      if (confirm(`¿Eliminar ${db[code].name} del catálogo?`)) {
        delete db[code];
        localStorage.setItem(DB_KEY, JSON.stringify(db));
        updateCatCount();
        renderCat();
      }
    }

    function renderCart() {
      const container = document.getElementById('cartList');
      if (!container) return;
      container.innerHTML = '';
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 15px 0;">Escanea o ingresa un código.</div>';
        document.getElementById('totalText').innerText = '$0.00';
        calcChange();
        return;
      }

      cart.forEach((item, index) => {
        const sub = item.price * item.qty;
        total += sub;
        container.innerHTML += `
          <div class="cart-item">
            <div>
              <div style="font-size:12px; font-weight:bold;">${item.name}</div>               <div style="font-size:10px; color:var(--emerald);">$${item.price.toFixed(2)} x ${item.qty} =$${sub.toFixed(2)}</div>
            </div>
            <div style="display:flex; gap:6px; align-items:center;">
              <button class="cart-qty-btn" onclick="modQty(${index}, -1)">-</button>
              <span style="font-size:12px; font-weight:bold;">${item.qty}</span>
              <button class="cart-qty-btn" onclick="modQty(${index}, 1)">+</button>
            </div>
          </div>
        `;
      });

      document.getElementById('totalText').innerText = `$${total.toFixed(2)}`;
      calcChange();
    }

    function modQty(index, delta) {
      const item = cart[index];
      const prod = db[item.code];

      if (delta > 0 && item.qty + 1 > prod.stock) {
        return alert(`⚠️ Stock límite alcanzado (${prod.stock} disponibles).`);
      }

      item.qty += delta;
      if (item.qty <= 0) cart.splice(index, 1);
      renderCart();
    }

    function clearCart() { cart = []; renderCart(); }

    function calcChange() {
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      const pay = parseFloat(document.getElementById('payInput').value) || 0;
      const el = document.getElementById('changeText');

      if (!el) return;

      if (total === 0) {
        el.innerText = '$0.00';
        el.style.color = 'var(--text-muted)';
        return;
      }

      const diff = pay - total;
      if (diff >= 0) {
        el.innerText = `$${diff.toFixed(2)}`;
        el.style.color = 'var(--emerald)';
      } else {
        el.innerText = `Falta $${Math.abs(diff).toFixed(2)}`;
        el.style.color = 'var(--rose)';
      }
    }

    function checkout() {
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      const pay = parseFloat(document.getElementById('payInput').value) || 0;

      if (cart.length === 0) return alert("Agrega productos primero.");
      if (pay < total) return alert(`Ingresa un pago mayor o igual a $${total.toFixed(2)}`);

      cart.forEach(item => {
        if (db[item.code]) {
          db[item.code].stock -= item.qty;
          if (db[item.code].stock < 0) db[item.code].stock = 0;
        }
      });
      localStorage.setItem(DB_KEY, JSON.stringify(db));

      sales.push({ date: new Date().toISOString(), total, items: [...cart] });
      localStorage.setItem(SALES_KEY, JSON.stringify(sales));

      alert(`✅ Venta realizada\nTotal: $${total.toFixed(2)}\nCambio:$${(pay - total).toFixed(2)}`);
      clearCart();
      document.getElementById('payInput').value = '';
    }

    async function toggleCam() {
      const btn = document.getElementById('camToggleBtn');

      if (isScanning) {
        if (html5QrCode) {
          try {
            await html5QrCode.stop();
            await html5QrCode.clear();
          } catch(e) {}
        }
        isScanning = false;
        if (btn) {
          btn.innerText = "Encender Cámara";
          btn.className = "btn btn-amber btn-xs";
        }
        setStatus("📷 Cámara Apagada");
        return;
      }

      try {
        setStatus("⏳ Iniciando permisos...");
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        }
        
        const qrCodeSuccessCallback = (decodedText, decodedResult) => {
          processCode(decodedText);
        };
        
        const config = { fps: 10, qrbox: { width: 200, height: 100 } };

        await html5QrCode.start(
          { facingMode: "environment" }, 
          config, 
          qrCodeSuccessCallback,
          (errorMessage) => {}
        );

        isScanning = true;
        if (btn) {
          btn.innerText = "Apagar";
          btn.className = "btn btn-rose btn-xs";
        }
        setStatus("🟢 Cámara Activa");
      } catch (err) {
        console.error(err);
        setStatus("❌ Error de cámara");
        alert("No se pudo iniciar la cámara. Verifica los permisos de tu navegador o que la página use HTTPS.");
      }
    }

    async function scanImage(input) {
      if (!input.files || !input.files[0]) return;
      try {
        if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
        setStatus("⏳ Leyendo imagen...");
        const decodedText = await html5QrCode.scanFile(input.files[0], true);
        processCode(decodedText);
        setStatus("📷 Imagen leída con éxito");
      } catch (err) {
        setStatus("❌ Sin código detectado");
        alert("No se pudo leer un código de barras en la foto seleccionada.");
      } finally {
        input.value = '';
      }
    }

    function openInventory() {
      document.getElementById('catModal').classList.remove('hidden');
      renderCat();
    }

    function renderCat() {
      const q = (document.getElementById('catSearch').value || '').toLowerCase();
      const list = document.getElementById('catList');
      if (!list) return;
      list.innerHTML = '';
      
      const keys = Object.keys(db);
      if (keys.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:20px; font-size:12px;">No hay productos registrados todavía.</div>';
        return;
      }

      keys.forEach(code => {
        const item = db[code];
        if (q && !item.name.toLowerCase().includes(q) && !code.includes(q)) return;
        
        const isLow = item.stock <= 3;
        const badgeClass = isLow ? 'stock-low' : 'stock-ok';

        list.innerHTML += `
          <div style="display:flex; justify-content:space-between; align-items:center; padding: 10px 0; border-bottom:1px solid #334155;">
            <div style="flex:1; cursor:pointer;" onclick="selectFromCat('${code}')">
              <div style="font-size:12px; font-weight:bold;">${item.name}</div>
              <div style="font-size:10px; color:var(--text-muted); font-family:monospace;">${code}</div>
              <span class="badge-stock ${badgeClass}">Stock: ${item.stock}</span>
