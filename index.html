<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abarrotes Reyes Magos - POS</title>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background-color: #0f172a !important;
      color: #f8fafc !important;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding-bottom: 3rem;
      min-height: 100vh;
    }
    #reader video {
      object-fit: cover !important;
      border-radius: 0.75rem;
      width: 100% !important;
      max-height: 220px;
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🏪</span>
        <div>
          <h1 class="font-bold text-base text-amber-400 leading-tight">Abarrotes Reyes Magos</h1>
          <p class="text-[11px] text-slate-400">Control de Precios & Inventario</p>
        </div>
      </div>
      <div id="statusBadge" class="text-[11px] bg-slate-700 px-2.5 py-1 rounded-full text-slate-300 font-mono">0 Prod.</div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-4 space-y-4">

    <!-- ESCÁNER CÁMARA -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold text-slate-200 text-xs uppercase tracking-wider">Cámara de Escaneo</h2>
        <button id="toggleCamBtn" onclick="toggleCamera()" class="px-3.5 py-2 bg-amber-500 text-slate-950 text-xs font-bold rounded-lg active:scale-95 transition">
          Encender Cámara
        </button>
      </div>
      
      <div class="relative overflow-hidden rounded-xl border border-slate-700 bg-slate-950 min-h-[160px] flex items-center justify-center">
        <div id="reader" class="w-full"></div>
        <div id="scanner-placeholder" class="p-6 text-center text-xs text-slate-400 absolute">
          📷 Cámara apagada.<br>Toca "Encender Cámara" para activar.
        </div>
      </div>
    </div>

    <!-- Navegación Tab -->
    <nav class="grid grid-cols-4 bg-slate-800 p-1 rounded-xl border border-slate-700 text-xs font-medium gap-1">
      <button onclick="switchTab('scan')" id="tab-scan" class="py-2.5 text-center rounded-lg bg-amber-500 text-slate-950 font-bold">Escáner</button>
      <button onclick="switchTab('pos')" id="tab-pos" class="py-2.5 text-center rounded-lg text-slate-300 hover:bg-slate-700">Venta</button>
      <button onclick="switchTab('inventory')" id="tab-inventory" class="py-2.5 text-center rounded-lg text-slate-300 hover:bg-slate-700">Stock</button>
      <button onclick="switchTab('data')" id="tab-data" class="py-2.5 text-center rounded-lg text-slate-300 hover:bg-slate-700">Datos</button>
    </nav>

    <!-- SECCIÓN 1: ESCÁNER / BÚSQUEDA -->
    <section id="sec-scan" class="space-y-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
        <label class="block text-xs font-semibold text-slate-300">Buscar / Alta Manual</label>
        <form onsubmit="handleManualSearch(event)" class="flex gap-2">
          <input type="number" pattern="[0-9]*" id="manualBarcodeScan" placeholder="Código de barras..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
          <button type="submit" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-xs font-semibold text-slate-200 active:scale-95 transition">
            Buscar
          </button>
        </form>
      </div>

      <!-- Ficha de Producto (Se despliega automáticamente) -->
      <div id="productCard" class="hidden bg-slate-800 p-4 rounded-xl border border-amber-500/50 space-y-3">
        <div class="flex justify-between items-center">
          <span id="barcodeDisplay" class="text-xs font-mono bg-slate-900 px-2 py-1 rounded text-amber-400 border border-slate-700">0000000000000</span>
          <span id="sourceTag" class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-slate-700 text-slate-300">NUEVO</span>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Nombre del Producto</label>
          <input type="text" id="prodName" placeholder="Ej. Galletas Emperador 100g" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Precio ($)</label>
            <input type="number" step="0.5" id="prodPrice" placeholder="0.00" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-emerald-400 font-bold focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Stock</label>
            <input type="number" id="prodStock" placeholder="0" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-1">
          <button type="button" onclick="saveProduct()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-lg active:scale-95 transition text-xs">
            Guardar
          </button>
          <button type="button" onclick="addCurrentToCart()" class="bg-emerald-600 hover:bg-emerald-500 text-slate-100 font-bold py-2.5 rounded-lg active:scale-95 transition text-xs">
            + A Venta
          </button>
        </div>
      </div>
    </section>

    <!-- SECCIÓN 2: VENTA (POS) -->
    <section id="sec-pos" class="hidden space-y-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
        <label class="block text-xs font-semibold text-slate-300">Agregar Código Manual a Venta</label>
        <form onsubmit="handlePOSManual(event)" class="flex gap-2">
          <input type="number" pattern="[0-9]*" id="manualBarcodePOS" placeholder="Código de barras..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
          <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-xs font-bold text-slate-100 active:scale-95 transition">
            + Agregar
          </button>
        </form>
      </div>

      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-slate-200 text-sm">Carrito Actual</h2>
          <button type="button" onclick="clearCart()" class="text-[11px] text-rose-400 hover:underline">Vaciar</button>
        </div>

        <div id="cartList" class="space-y-2 text-xs divide-y divide-slate-700/50">
          <p class="text-slate-500 text-center py-4">Sin productos en el carrito.</p>
        </div>

        <div class="border-t border-slate-700 pt-3 space-y-2">
          <div class="flex justify-between items-center">
            <span class="text-sm font-semibold text-slate-300">Total:</span>
            <span id="cartTotal" class="text-emerald-400 text-2xl font-black">$0.00</span>
          </div>

          <div class="grid grid-cols-2 gap-2 pt-2">
            <div>
              <label class="block text-[10px] text-slate-400 mb-1">Pago ($)</label>
              <input type="number" id="payAmount" oninput="calculateChange()" placeholder="0.00" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
            </div>
            <div>
              <label class="block text-[10px] text-slate-400 mb-1">Cambio ($)</label>
              <div id="changeAmount" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-sm font-bold text-slate-500 flex items-center">$0.00</div>
            </div>
          </div>

          <button type="button" onclick="completeSale()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl active:scale-95 transition text-xs uppercase tracking-wider mt-2">
            ✓ Cobrar Venta
          </button>
        </div>
      </div>
    </section>

    <!-- SECCIÓN 3: STOCK -->
    <section id="sec-inventory" class="hidden space-y-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
        <h2 class="font-bold text-slate-200 text-sm">Inventario Registrado</h2>
        <div id="inventoryList" class="space-y-2 text-xs"></div>
      </div>
    </section>

    <!-- SECCIÓN 4: DATOS -->
    <section id="sec-data" class="hidden space-y-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
        <h2 class="font-bold text-slate-200 text-sm">Base de Datos</h2>
        <button type="button" onclick="exportJSON()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-100 p-2.5 rounded-lg text-xs font-semibold">
          Exportar copia de seguridad (JSON)
        </button>
        <button type="button" onclick="clearAllData()" class="w-full bg-rose-950/60 hover:bg-rose-900 text-rose-300 p-2.5 rounded-lg text-xs font-semibold border border-rose-800/50">
          Borrar toda la base de datos
        </button>
      </div>
    </section>

  </main>

  <script>
    const DB_KEY = 'reyes_magos_db_v2';
    let db = {};
    let cart = [];
    let html5QrCode = null;
    let isScanning = false;
    let currentBarcode = null;
    let currentTab = 'scan';

    document.addEventListener("DOMContentLoaded", () => {
      initDB();
      updateBadge();
    });

    function initDB() {
      try {
        const raw = localStorage.getItem(DB_KEY);
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
          db = parsed;
        } else {
          db = {};
        }
      } catch (e) {
        db = {};
      }
    }

    function saveDB() {
      try {
        localStorage.setItem(DB_KEY, JSON.stringify(db));
      } catch (e) {
        alert("Atención: No se pudo escribir en el almacenamiento del navegador.");
      }
      updateBadge();
    }

    function updateBadge() {
      const badge = document.getElementById('statusBadge');
      if (badge) badge.innerText = `${Object.keys(db).length} Prod.`;
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.value = 1800;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch (e) {}
    }

    async function toggleCamera() {
      const btn = document.getElementById('toggleCamBtn');
      const placeholder = document.getElementById('scanner-placeholder');

      if (typeof Html5Qrcode === 'undefined') {
        alert("El motor de escaneo está cargando. Intenta de nuevo en un segundo.");
        return;
      }

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      if (isScanning) {
        try {
          await html5QrCode.stop();
          isScanning = false;
          btn.innerText = "Encender Cámara";
          btn.className = "px-3.5 py-2 bg-amber-500 text-slate-950 text-xs font-bold rounded-lg active:scale-95 transition";
          if (placeholder) placeholder.style.display = 'block';
        } catch (err) {
          console.error(err);
        }
      } else {
        try {
          const cameras = await Html5Qrcode.getCameras();
          if (!cameras || cameras.length === 0) {
            alert("No se detectó ninguna cámara en este dispositivo.");
            return;
          }

          // Seleccionar la cámara trasera (normalmente la última en dispositivos Android)
          let backCam = cameras.find(c => c.label.toLowerCase().includes('back') || c.label.toLowerCase().includes('trasera')) || cameras[cameras.length - 1];

          if (placeholder) placeholder.style.display = 'none';

          await html5QrCode.start(
            backCam.id,
            { fps: 10, qrbox: { width: 220, height: 140 } },
            onScanSuccess
          );

          isScanning = true;
          btn.innerText = "Apagar Cámara";
          btn.className = "px-3.5 py-2 bg-rose-500 text-slate-100 text-xs font-bold rounded-lg active:scale-95 transition";

        } catch (err) {
          if (placeholder) placeholder.style.display = 'block';
          alert("Permiso de cámara denegado o no disponible en HTTPS.");
        }
      }
    }

    function onScanSuccess(decodedText) {
      if (navigator.vibrate) navigator.vibrate(60);
      playBeep();
      processBarcode(decodedText);
    }

    function handleManualSearch(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('manualBarcodeScan');
      if (!input) return;
      const code = input.value.trim();
      if (!code) return;
      processBarcode(code);
    }

    function handlePOSManual(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('manualBarcodePOS');
      if (!input) return;
      const code = input.value.trim();
      if (!code) return;
      addToCart(code);
      input.value = '';
    }

    function processBarcode(code) {
      if (!code) return;

      if (currentTab === 'pos') {
        addToCart(code);
      } else {
        currentBarcode = code;
        const pCard = document.getElementById('productCard');
        if (pCard) {
          pCard.classList.remove('hidden');
          pCard.style.display = 'block';
          pCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        
        document.getElementById('barcodeDisplay').innerText = code;

        if (db[code]) {
          document.getElementById('prodName').value = db[code].name || '';
          document.getElementById('prodPrice').value = db[code].price !== undefined ? db[code].price : '';
          document.getElementById('prodStock').value = db[code].stock !== undefined ? db[code].stock : 0;
          document.getElementById('sourceTag').innerText = "REGISTRADO";
          document.getElementById('sourceTag').className = "text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-emerald-900 text-emerald-300";
        } else {
          document.getElementById('prodName').value = '';
          document.getElementById('prodPrice').value = '';
          document.getElementById('prodStock').value = '10';
          document.getElementById('sourceTag').innerText = "NUEVO";
          document.getElementById('sourceTag').className = "text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-amber-900 text-amber-300";
        }
      }
    }

    function saveProduct() {
      if (!currentBarcode) return;
      const name = document.getElementById('prodName').value.trim();
      const price = parseFloat(document.getElementById('prodPrice').value) || 0;
      const stock = parseInt(document.getElementById('prodStock').value) || 0;

      if (!name) return alert("Escribe un nombre para el producto.");

      db[currentBarcode] = { name, price, stock };
      saveDB();
      document.getElementById('sourceTag').innerText = "GUARDADO";
      document.getElementById('sourceTag').className = "text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-emerald-900 text-emerald-300";
      alert(`Producto "${name}" guardado.`);
    }

    function addCurrentToCart() {
      if (!currentBarcode) return;
      if (!db[currentBarcode]) {
        saveProduct();
      }
      addToCart(currentBarcode);
      switchTab('pos');
    }

    function addToCart(code) {
      if (!db[code]) {
        alert(`El código ${code} no está registrado. Agrégalo primero en la pestaña Escáner.`);
        return;
      }

      const existingIndex = cart.findIndex(item => item.code === code);
      if (existingIndex > -1) {
        cart[existingIndex].qty += 1;
      } else {
        cart.push({
          code: code,
          name: db[code].name,
          price: db[code].price,
          qty: 1
        });
      }
      renderCart();
    }

    function updateQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }
      renderCart();
    }

    function clearCart() {
      cart = [];
      const payInput = document.getElementById('payAmount');
      if (payInput) payInput.value = '';
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cartList');
      if (!container) return;
      container.innerHTML = '';
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-center py-4">Sin productos en el carrito.</p>`;
        document.getElementById('cartTotal').innerText = '$0.00';
        calculateChange();
        return;
      }

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;

        container.innerHTML += `
          <div class="flex justify-between items-center pt-2">
            <div>
              <p class="font-bold text-slate-200 text-xs">${item.name}</p>
              <p class="text-emerald-400 font-mono text-[11px]">$${item.price.toFixed(2)} x ${item.qty} = $${itemTotal.toFixed(2)}</p>
            </div>
            <div class="flex items-center gap-2">
              <button type="button" onclick="updateQty(${index}, -1)" class="w-6 h-6 bg-slate-700 text-slate-200 rounded font-bold hover:bg-slate-600">-</button>
              <span class="font-mono text-xs w-4 text-center">${item.qty}</span>
              <button type="button" onclick="updateQty(${index}, 1)" class="w-6 h-6 bg-slate-700 text-slate-200 rounded font-bold hover:bg-slate-600">+</button>
            </div>
          </div>
        `;
      });

      document.getElementById('cartTotal').innerText = `$${total.toFixed(2)}`;
      calculateChange();
    }

    function calculateChange() {
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const payInput = document.getElementById('payAmount');
      const pay = parseFloat(payInput ? payInput.value : 0) || 0;
      const changeDisplay = document.getElementById('changeAmount');

      if (!changeDisplay) return;

      if (total === 0) {
        changeDisplay.innerText = "$0.00";
        changeDisplay.className = "w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-sm font-bold text-slate-500 flex items-center";
        return;
      }

      const change = pay - total;
      if (pay >= total) {
        changeDisplay.innerText = `$${change.toFixed(2)}`;
        changeDisplay.className = "w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-sm font-bold text-emerald-400 flex items-center";
      } else {
        changeDisplay.innerText = `Falta $${Math.abs(change).toFixed(2)}`;
        changeDisplay.className = "w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs font-bold text-rose-400 flex items-center";
      }
    }

    function completeSale() {
      if (cart.length === 0) return alert("El carrito está vacío.");
      
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
