<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abarrotes Reyes Magos - POS</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js" onerror="window.camLibFailed=true"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --amber: #f59e0b;
      --emerald: #10b981;
      --rose: #e11d48;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; max-width: 500px; margin: 0 auto; padding-bottom: 50px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .title { font-size: 16px; font-weight: bold; color: var(--amber); }
    .version { font-size: 10px; color: var(--emerald); font-weight: bold; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .card-title { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    
    .btn { width: 100%; padding: 10px 14px; border-radius: 8px; border: none; font-weight: bold; font-size: 13px; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
    .btn-amber { background: var(--amber); color: #000; }
    .btn-emerald { background: var(--emerald); color: #000; }
    .btn-slate { background: #334155; color: #fff; }
    .btn-rose { background: var(--rose); color: #fff; }
    
    .input { width: 100%; background: #020617; border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: #fff; font-size: 14px; outline: none; }
    .input:focus { border-color: var(--amber); }
    
    .scanner-container { background: #020617; border-radius: 8px; padding: 8px; text-align: center; margin-bottom: 10px; border: 1px solid var(--border); }
    #reader { width: 100%; min-height: 120px; border-radius: 6px; overflow: hidden; }
    #reader video { width: 100% !important; max-height: 200px; object-fit: cover; }
    
    .flex-gap { display: flex; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .cart-qty-btn { width: 28px; height: 28px; background: var(--border); color: #fff; border: none; border-radius: 4px; font-weight: bold; }
    
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 360px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="title">🏪 Abarrotes Reyes Magos</div>
      <div class="version">Punto de Venta [v5.4 Clean UI]</div>
    </div>
    <button class="btn btn-slate" style="width: auto; padding: 6px 10px; font-size: 11px;" onclick="openInventory()">
      📋 Catálogo (<span id="catCount">0</span>)
    </button>
  </div>

  <!-- SECCIÓN CÁMARA Y ENTRADA -->
  <div class="card">
    <div class="card-title">
      <span>Escáner / Entrada</span>
      <button id="camToggleBtn" class="btn btn-amber" style="width: auto; padding: 6px 10px; font-size: 11px;" onclick="toggleCam()">
        Encender Cámara
      </button>
    </div>

    <div class="scanner-container">
      <div id="camStatus" style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">📷 Cámara Apagada</div>
      <div id="reader"></div>
    </div>

    <div class="flex-gap" style="margin-bottom: 10px;">
      <label class="btn btn-slate" style="font-size: 11px; cursor: pointer;">
        📷 Capturar Foto de Código
        <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="scanImage(this)">
      </label>
    </div>

    <div class="flex-gap">
      <input type="text" id="manualCode" class="input" placeholder="Escribir código de barras..." inputmode="numeric" onkeydown="if(event.key==='Enter') addManual()">
      <button class="btn btn-amber" style="width: 100px;" onclick="addManual()">+ Agregar</button>
    </div>
  </div>

  <!-- TICKET DE COMPRA -->
  <div class="card">
    <div class="card-title">
      <span>🛒 Ticket de Compra</span>
      <button class="btn btn-rose" style="width: auto; padding: 4px 8px; font-size: 10px;" onclick="clearCart()">Vaciar</button>
    </div>

    <div id="cartList" style="min-height: 60px; margin-bottom: 10px;">
      <div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 15px 0;">Escanea o ingresa un código.</div>
    </div>

    <div style="background: #020617; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <span style="font-size: 12px; font-weight: bold;">TOTAL:</span>
      <span id="totalText" style="font-size: 26px; font-weight: 900; color: var(--emerald); font-family: monospace;">$0.00</span>
    </div>

    <div class="grid-2" style="margin-bottom: 10px;">
      <div>
        <label style="font-size: 10px; color: var(--text-muted); font-weight: bold; display: block; margin-bottom: 4px;">EFECTIVO ($)</label>
        <input type="number" id="payInput" class="input" placeholder="0.00" oninput="calcChange()">
      </div>
      <div>
        <label style="font-size: 10px; color: var(--text-muted); font-weight: bold; display: block; margin-bottom: 4px;">CAMBIO ($)</label>
        <div id="changeText" style="background: #020617; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-weight: bold; font-family: monospace; font-size: 14px; color: var(--text-muted);">
          $0.00
        </div>
      </div>
    </div>

    <button class="btn btn-emerald" style="padding: 12px;" onclick="checkout()">✓ FINALIZAR Y COBRAR</button>
  </div>

  <!-- MODAL NUEVO PRODUCTO -->
  <div id="newProdModal" class="modal hidden">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="color: var(--amber); font-size: 14px;">📦 Producto No Registrado</strong>
        <button onclick="closeModal('newProdModal')" style="background:none; border:none; color:#fff; font-weight:bold;">✕</button>
      </div>
      <div style="font-size: 11px; color: var(--text-muted);">Código: <span id="modalCode" style="color: var(--amber); font-family: monospace;"></span></div>
      <input type="text" id="newProdName" class="input" placeholder="Nombre del Producto">
      <div class="grid-2">
        <input type="number" step="any" id="newProdPrice" class="input" placeholder="Precio $">
        <input type="number" id="newProdStock" class="input" placeholder="Stock" value="10">
      </div>
      <button class="btn btn-amber" onclick="saveNewProd()">Guardar y Sumar</button>
    </div>
  </div>

  <!-- MODAL CATÁLOGO -->
  <div id="catModal" class="modal hidden">
    <div class="modal-content" style="max-height: 80vh;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="color: var(--amber);">📋 Catálogo de Productos</strong>
        <button onclick="closeModal('catModal')" style="background:none; border:none; color:#fff; font-weight:bold;">✕</button>
      </div>
      <input type="text" id="catSearch" class="input" placeholder="🔍 Buscar..." oninput="renderCat()">
      <div id="catList" style="flex:1; overflow-y:auto; max-height: 300px;"></div>
      <button class="btn btn-slate" onclick="closeModal('catModal')">Cerrar</button>
    </div>
  </div>

  <script>
    function setStatus(msg) {
      const el = document.getElementById('camStatus');
      if (el) el.innerText = msg;
    }

    const DB_KEY = 'reyes_magos_v51';
    let db = {}, cart = [], scanner = null, isScanning = false, pendingCode = null;

    window.onload = function() {
      try {
        db = JSON.parse(localStorage.getItem(DB_KEY)) || {};
      } catch(e) { db = {}; }
      updateCatCount();
      renderCart();
    };

    function updateCatCount() {
      const el = document.getElementById('catCount');
      if (el) el.innerText = Object.keys(db).length;
    }

    function addManual() {
      const input = document.getElementById('manualCode');
      if (!input) return;
      const code = input.value.trim();
      if (!code) return;
      processCode(code);
      input.value = '';
    }

    function processCode(code) {
      if (db[code]) {
        const idx = cart.findIndex(i => i.code === code);
        if (idx > -1) cart[idx].qty++;
        else cart.push({ code, name: db[code].name, price: db[code].price, qty: 1 });
        renderCart();
      } else {
        pendingCode = code;
        const mc = document.getElementById('modalCode');
        if (mc) mc.innerText = code;
        document.getElementById('newProdName').value = '';
        document.getElementById('newProdPrice').value = '';
        document.getElementById('newProdModal').classList.remove('hidden');
      }
    }

    function saveNewProd() {
      const name = document.getElementById('newProdName').value.trim();
      const price = parseFloat(document.getElementById('newProdPrice').value);
      const stock = parseInt(document.getElementById('newProdStock').value) || 0;

      if (!name || isNaN(price) || price <= 0) return alert("Nombre y precio válido requeridos.");

      db[pendingCode] = { name, price, stock };
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      updateCatCount();
      processCode(pendingCode);
      closeModal('newProdModal');
    }

    function renderCart() {
      const container = document.getElementById('cartList');
      if (!container) return;
      container.innerHTML = '';
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 15px 0;">Escanea o ingresa un código.</div>';
        document.getElementById('totalText').innerText = '$0.00';
        calcChange();
        return;
      }

      cart.forEach((item, index) => {
        const sub = item.price * item.qty;
        total += sub;
        container.innerHTML += `
          <div class="cart-item">
            <div>
              <div style="font-size:12px; font-weight:bold;">${item.name}</div>
              <div style="font-size:10px; color:var(--emerald);">$${item.price.toFixed(2)} x ${item.qty} = $${sub.toFixed(2)}</div>
            </div>
            <div style="display:flex; gap:6px; align-items:center;">
              <button class="cart-qty-btn" onclick="modQty(${index}, -1)">-</button>
              <span style="font-size:12px; font-weight:bold;">${item.qty}</span>
              <button class="cart-qty-btn" onclick="modQty(${index}, 1)">+</button>
            </div>
          </div>
        `;
      });

      document.getElementById('totalText').innerText = `$${total.toFixed(2)}`;
      calcChange();
    }

    function modQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      renderCart();
    }

    function clearCart() { cart = []; renderCart(); }

    function calcChange() {
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      const pay = parseFloat(document.getElementById('payInput').value) || 0;
      const el = document.getElementById('changeText');

      if (!el) return;

      if (total === 0) {
        el.innerText = '$0.00';
        el.style.color = 'var(--text-muted)';
        return;
      }

      const diff = pay - total;
      if (diff >= 0) {
        el.innerText = `$${diff.toFixed(2)}`;
        el.style.color = 'var(--emerald)';
      } else {
        el.innerText = `Falta $${Math.abs(diff).toFixed(2)}`;
        el.style.color = 'var(--rose)';
      }
    }

    function checkout() {
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      const pay = parseFloat(document.getElementById('payInput').value) || 0;

      if (cart.length === 0) return alert("Agrega productos primero.");
      if (pay < total) return alert(`Ingresa un pago mayor o igual a $${total.toFixed(2)}`);

      alert(`✅ Venta realizada\nTotal: $${total.toFixed(2)}\nCambio: $${(pay - total).toFixed(2)}`);
      clearCart();
      document.getElementById('payInput').value = '';
    }

    async function toggleCam() {
      if (window.camLibFailed || typeof Html5Qrcode === 'undefined') {
        return alert("No se pudo cargar la librería de cámara.");
      }

      const btn = document.getElementById('camToggleBtn');

      if (isScanning) {
        setStatus("⏳ Cerrando cámara...");
        if (scanner) {
          try {
            await scanner.stop();
            await scanner.clear();
          } catch(e) {}
          scanner = null;
        }
        isScanning = false;
        if (btn) {
          btn.innerText = "Encender Cámara";
          btn.className = "btn btn-amber";
        }
        setStatus("📷 Cámara Apagada");
        return;
      }

      try {
        if (!scanner) scanner = new Html5Qrcode("reader");
        setStatus("⏳ Encendiendo...");
        
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 120 } },
          (text) => { processCode(text); },
          () => {}
        );

        isScanning = true;
        if (btn) {
          btn.innerText = "Apagar";
          btn.className = "btn btn-rose";
        }
        setStatus("🟢 Cámara Activa");
      } catch(e) {
        setStatus("❌ Error al abrir cámara");
        alert("La cámara no se pudo activar. Intenta recargar la página.");
      }
    }

    async function scanImage(input) {
      if (!input.files || !input.files[0]) return;
      if (typeof Html5Qrcode === 'undefined') return alert("Librería no lista.");
      
      try {
        if (!scanner) scanner = new Html5Qrcode("reader");
        const res = await scanner.scanFile(input.files[0], true);
        processCode(res);
      } catch(e) {
        alert("No se detectó código de barras en la foto.");
      } finally { input.value = ''; }
    }

    function openInventory() {
      document.getElementById('catModal').classList.remove('hidden');
      renderCat();
    }

    function renderCat() {
      const q = (document.getElementById('catSearch').value || '').toLowerCase();
      const list = document.getElementById('catList');
      if (!list) return;
      list.innerHTML = '';
      
      Object.keys(db).forEach(code => {
        const item = db[code];
        if (q && !item.name.toLowerCase().includes(q) && !code.includes(q)) return;
        list.innerHTML += `
          <div style="display:flex; justify-content:space-between; align-items:center; padding: 8px 0; border-bottom:1px solid #334155;">
            <div>
              <div style="font-size:12px; font-weight:bold;">${item.name}</div>
              <div style="font-size:10px; color:var(--text-muted); font-family:monospace;">${code}</div>
            </div>
            <div style="color:var(--emerald); font-weight:bold; font-size:12px;">$${item.price.toFixed(2)}</div>
          </div>
        `;
      });
    }

    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  </script>
</body>
</html>
