<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abarrotes Reyes Magos - POS</title>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background-color: #0f172a !important;
      color: #f8fafc !important;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding-bottom: 4rem;
      min-height: 100vh;
    }
    #reader video {
      object-fit: cover !important;
      border-radius: 0.75rem;
      width: 100% !important;
      max-height: 200px;
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

  <!-- Logger de Errores Visuales -->
  <div id="debugBox" style="display:none; background:#7f1d1d; color:#fff; padding:10px; font-size:12px; font-family:monospace; position:fixed; top:0; left:0; right:0; z-index:99999;"></div>

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🏪</span>
        <div>
          <h1 class="font-bold text-base text-amber-400 leading-tight">Abarrotes Reyes Magos</h1>
          <p class="text-[11px] text-slate-400">Punto de Venta <span class="text-emerald-400 font-bold">[v4.0 CONTINUO]</span></p>
        </div>
      </div>
      <div id="statusBadge" class="text-[11px] bg-slate-700 px-2.5 py-1 rounded-full text-slate-300 font-mono">0 Prod.</div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-4 space-y-4">

    <!-- SECCIÓN CÁMARA & BÚSQUEDA -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold text-slate-200 text-xs uppercase tracking-wider">Escáner / Lector</h2>
        <button type="button" id="toggleCamBtn" onclick="toggleCamera()" class="px-3.5 py-2 bg-amber-500 text-slate-950 text-xs font-bold rounded-lg active:scale-95 transition">
          Encender Cámara
        </button>
      </div>
      
      <div class="relative overflow-hidden rounded-xl border border-slate-700 bg-slate-950 min-h-[160px] flex items-center justify-center">
        <div id="reader" class="w-full min-h-[160px]"></div>
        <div id="scanner-placeholder" class="p-6 text-center text-xs text-slate-400 absolute">
          📷 Cámara apagada.<br>Toca "Encender Cámara" para activar.
        </div>
      </div>

      <!-- Entrada Manual -->
      <form onsubmit="runManualSearch(event)" class="flex gap-2 pt-1">
        <input type="text" inputmode="numeric" pattern="[0-9]*" id="manualBarcodeScan" placeholder="Escribir código de barras..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
        <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-lg text-xs font-bold active:scale-95 transition">
          + Sumar
        </button>
      </form>
    </div>

    <!-- TICKET DE COMPRA ACTUAL (CARRITO) -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 shadow-lg">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <h2 class="font-bold text-slate-200 text-sm">🛒 Ticket de Compra</h2>
        <button type="button" onclick="clearCart()" class="text-[11px] bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-rose-300 font-semibold">
          Vaciar Ticket
        </button>
      </div>

      <!-- Lista de Artículos -->
      <div id="cartList" class="space-y-2 text-xs divide-y divide-slate-700/50 min-h-[80px]">
        <p class="text-slate-500 text-center py-6">Escanea productos para iniciar la venta.</p>
      </div>

      <!-- TOTAL Y COBRO -->
      <div class="border-t-2 border-slate-700 pt-3 space-y-3">
        <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800">
          <span class="text-sm font-bold text-slate-300 uppercase">Total a Cobrar:</span>
          <span id="cartTotal" class="text-emerald-400 text-3xl font-black font-mono">$0.00</span>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Efectivo Recibido ($)</label>
            <input type="number" id="payAmount" oninput="calculateChange()" placeholder="0.00" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-base text-slate-100 font-bold focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Cambio ($)</label>
            <div id="changeAmount" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-base font-bold text-slate-500 flex items-center font-mono">
              $0.00
            </div>
          </div>
        </div>

        <button type="button" onclick="completeSale()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl active:scale-95 transition text-sm uppercase tracking-wider shadow-lg shadow-emerald-950/50">
          ✓ Finalizar y Cobrar Venta
        </button>
      </div>
    </div>

    <!-- MODAL / ALTA RÁPIDA DE PRODUCTO NUEVO -->
    <div id="newProductModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-slate-800 border border-amber-500/50 rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-2xl">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-amber-400 text-sm">📦 Producto No Registrado</h3>
          <button type="button" onclick="closeNewProductModal()" class="text-slate-400 text-xs font-bold">✕</button>
        </div>

        <p class="text-xs text-slate-300">Código: <span id="modalBarcode" class="font-mono bg-slate-900 px-2 py-0.5 rounded text-amber-300"></span></p>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Nombre del Producto</label>
          <input type="text" id="newProdName" placeholder="Ej. Coca Cola 600ml" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Precio Venta ($)</label>
            <input type="number" step="0.5" id="newProdPrice" placeholder="0.00" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-emerald-400 font-bold focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Stock Inicial</label>
            <input type="number" id="newProdStock" value="10" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <button type="button" onclick="saveAndAddProduct()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl active:scale-95 transition text-xs uppercase">
          Guardar y Sumar a Ticket
        </button>
      </div>
    </div>

    <!-- ACCIONES DE BASE DE DATOS -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center text-xs">
      <span class="text-slate-400">Opciones de Inventario:</span>
      <div class="flex gap-2">
        <button type="button" onclick="exportJSON()" class="bg-slate-700 px-3 py-1.5 rounded text-slate-200 font-semibold">Exportar Copy</button>
        <button type="button" onclick="clearAllData()" class="bg-rose-950/60 text-rose-300 px-3 py-1.5 rounded font-semibold border border-rose-800/40">Borrar DB</button>
      </div>
    </div>

  </main>

  <script>
    // Capturador de errores JS
    window.onerror = function(msg, url, lineNo) {
      const box = document.getElementById('debugBox');
      if (box) {
        box.style.display = 'block';
        box.innerText = `⚠️ Error JS: ${msg} (Línea ${lineNo})`;
      }
      return false;
    };

    const DB_KEY = 'reyes_magos_db_v4';
    let db = {};
    let cart = [];
    let html5QrCode = null;
    let isScanning = false;
    let lastScanCode = null;
    let lastScanTime = 0;
    let pendingBarcode = null;

    document.addEventListener("DOMContentLoaded", () => {
      try {
        db = JSON.parse(localStorage.getItem(DB_KEY)) || {};
      } catch(e) {
        db = {};
      }
      updateBadge();
      renderCart();
    });

    function saveDB() {
      try {
        localStorage.setItem(DB_KEY, JSON.stringify(db));
      } catch(e) {}
      updateBadge();
    }

    function updateBadge() {
      const badge = document.getElementById('statusBadge');
      if (badge) badge.innerText = `${Object.keys(db).length} Prod.`;
    }

    // Beep sintético con Web Audio API
    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.value = 1200;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch(e) {}
    }

    function runManualSearch(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('manualBarcodeScan');
      if (!input) return;
      const code = input.value.trim();
      if (!code) return;
      processBarcode(code);
      input.value = '';
    }

    function processBarcode(code) {
      if (!code) return;

      // Cooldown de 1.5 segundos para evitar lecturas duplicadas por cámara
      const now = Date.now();
      if (code === lastScanCode && (now - lastScanTime) < 1500) {
        return;
      }
      lastScanCode = code;
      lastScanTime = now;

      if (navigator.vibrate) navigator.vibrate(60);
      playBeep();

      if (db[code]) {
        // Producto Existe: Agregar directo al ticket
        addToCart(code);
      } else {
        // Producto Nuevo: Abrir Modal
        pendingBarcode = code;
        document.getElementById('modalBarcode').innerText = code;
        document.getElementById('newProdName').value = '';
        document.getElementById('newProdPrice').value = '';
        document.getElementById('newProdStock').value = '10';
        document.getElementById('newProductModal').classList.remove('hidden');
        setTimeout(() => document.getElementById('newProdName').focus(), 150);
      }
    }

    function saveAndAddProduct() {
      if (!pendingBarcode) return;
      const name = document.getElementById('newProdName').value.trim();
      const price = parseFloat(document.getElementById('newProdPrice').value) || 0;
      const stock = parseInt(document.getElementById('newProdStock').value) || 0;

      if (!name) return alert("Ingresa un nombre para el producto.");
      if (price <= 0) return alert("Ingresa un precio mayor a $0.");

      db[pendingBarcode] = { name, price, stock };
      saveDB();

      addToCart(pendingBarcode);
      closeNewProductModal();
    }

    function closeNewProductModal() {
      document.getElementById('newProductModal').classList.add('hidden');
      pendingBarcode = null;
    }

    function addToCart(code) {
      const prod = db[code];
      if (!prod) return;

      const existingIndex = cart.findIndex(item => item.code === code);
      if (existingIndex > -1) {
        cart[existingIndex].qty += 1;
      } else {
        cart.push({
          code: code,
          name: prod.name,
          price: prod.price,
          qty: 1
        });
      }
      renderCart();
    }

    function updateQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      renderCart();
    }

    function clearCart() {
      cart = [];
      document.getElementById('payAmount').value = '';
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cartList');
      if (!container) return;
      container.innerHTML = '';
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-center py-6">Escanea productos para iniciar la venta.</p>`;
        document.getElementById('cartTotal').innerText = '$0.00';
        calculateChange();
        return;
      }

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;

        container.innerHTML += `
          <div class="flex justify-between items-center pt-2">
            <div>
              <p class="font-bold text-slate-100 text-xs">${item.name}</p>
              <p class="text-emerald-400 font-mono text-[11px]">$${item.price.toFixed(2)} x ${item.qty} = <span class="font-bold text-emerald-300">$${itemTotal.toFixed(2)}</span></p>
            </div>
            <div class="flex items-center gap-2">
              <button type="button" onclick="updateQty(${index}, -1)" class="w-7 h-7 bg-slate-700 text-slate-200 rounded-lg font-bold hover:bg-slate-600 active:scale-95 text-sm">-</button>
              <span class="font-mono text-xs w-5 text-center font-bold text-slate-100">${item.qty}</span>
              <button type="button" onclick="updateQty(${index}, 1)" class="w-7 h-7 bg-slate-700 text-slate-200 rounded-lg font-bold hover:bg-slate-600 active:scale-95 text-sm">+</button>
            </div>
          </div>
        `;
      });

      document.getElementById('cartTotal').innerText = `$${total.toFixed(2)}`;
      calculateChange();
    }

    function calculateChange() {
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const payInput = document.getElementById('payAmount');
      const pay = parseFloat(payInput ? payInput.value : 0) || 0;
      const changeDisplay = document.getElementById('changeAmount');

      if (!changeDisplay) return;

      if (total === 0) {
        changeDisplay.innerText = "$0.00";
        changeDisplay.className = "w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-base font-bold text-slate-500 flex items-center font-mono";
        return;
      }

      const change = pay - total;
      if (pay >= total) {
        changeDisplay.innerText = `$${change.toFixed(2)}`;
        changeDisplay.className = "w-full bg-slate-950 border border-emerald-500/50 rounded-lg px-3 py-2 text-base font-bold text-emerald-400 flex items-center font-mono";
      } else {
        const falta = Math.abs(change);
        changeDisplay.innerText = `Falta $${falta.toFixed(2)}`;
        changeDisplay.className = "w-full bg-slate-950 border border-rose-500/50 rounded-lg px-3 py-2 text-xs font-bold text-rose-400 flex items-center font-mono";
      }
    }

    function completeSale() {
      if (cart.length === 0) return alert("El ticket está vacío.");
      
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const payInput = document.getElementById('payAmount');
      const pay = parseFloat(payInput ? payInput.value : 0) || 0;

      if (pay < total) {
        return alert(`El efectivo ingresado ($${pay.toFixed(2)}) es menor al total ($${total.toFixed(2)}).`);
      }

      // Descontar inventario
      cart.forEach(item => {
        if (db[item.code]) {
          db[item.code].stock = Math.max(0, (db[item.code].stock || 0) - item.qty);
        }
      });

      saveDB();
      const cambioFinal = pay - total;
      alert(`✅ ¡Venta Cobrada con Éxito!\n\nTotal: $${total.toFixed(2)}\nEfectivo: $${pay.toFixed(2)}\nCambio a Entregar: $${cambioFinal.toFixed(2)}`);
      
      clearCart();
    }

    async function toggleCamera() {
      const btn = document.getElementById('toggleCamBtn');
      const placeholder = document.getElementById('scanner-placeholder');

      if (typeof Html5Qrcode === 'undefined') {
        alert("El motor de escaneo no cargó. Revisa tu conexión a internet.");
        return;
      }

      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

      if (isScanning) {
        try {
          await html5QrCode.stop();
          isScanning = false;
          btn.innerText = "Encender Cámara";
          btn.className = "px-3.5 py-2 bg-amber-500 text-slate-950 text-xs font-bold rounded-lg active:scale-95 transition";
          if (placeholder) placeholder.style.display = 'block';
        } catch (err) {}
      } else {
        try {
          if (placeholder) placeholder.style.display = 'none';

          await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 240, height: 140 } },
            (decodedText) => {
              processBarcode(decodedText);
            },
            () => {}
          );

          isScanning = true;
          btn.innerText = "Apagar Cámara";
          btn.className = "px-3.5 py-2 bg-rose-500 text-slate-100 text-xs font-bold rounded-lg active:scale-95 transition";

        } catch (err) {
          if (placeholder) placeholder.style.display = 'block';
          alert("Permiso de cámara denegado o bloqueado.");
        }
      }
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `inventario_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function clearAllData() {
      if (confirm("¿Borrar todo el inventario guardado?")) {
        localStorage.removeItem(DB_KEY);
        db = {};
        updateBadge();
        alert("Base de datos borrada.");
      }
    }
  </script>
</body>
</html>
