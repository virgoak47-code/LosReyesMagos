<!-- Reemplaza desde <script> hasta </script> -->
<script>
  // Monitor visual de errores en pantalla
  window.onerror = function(msg, url, lineNo, columnNo, error) {
    let errDiv = document.getElementById('debug-log');
    if (!errDiv) {
      errDiv = document.createElement('div');
      errDiv.id = 'debug-log';
      errDiv.style = 'position:fixed;bottom:0;left:0;right:0;background:#991b1b;color:#fff;p:10px;font-size:11px;z-index:9999;max-height:100px;overflow:auto;padding:8px;font-family:monospace;';
      document.body.appendChild(errDiv);
    }
    errDiv.innerHTML = `⚠️ ERROR: ${msg} (Línea: ${lineNo})`;
    return false;
  };

  const DB_KEY = 'reyes_magos_db';
  let db = {};
  let cart = [];
  let html5QrCode = null;
  let isScanning = false;
  let currentBarcode = null;
  let currentTab = 'scan';

  document.addEventListener("DOMContentLoaded", () => {
    try {
      db = JSON.parse(localStorage.getItem(DB_KEY)) || {};
    } catch(e) {
      db = {};
    }
    repairDB();
    updateBadge();
  });

  function repairDB() {
    let modified = false;
    Object.keys(db).forEach(code => {
      if (db[code].stock === undefined || db[code].stock === null || isNaN(db[code].stock)) {
        db[code].stock = 0;
        modified = true;
      }
    });
    if (modified) saveDB();
  }

  function saveDB() {
    try {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
    } catch(e) {
      alert("Error al guardar en el almacenamiento del navegador");
    }
    updateBadge();
  }

  function updateBadge() {
    const badge = document.getElementById('statusBadge');
    if (badge) badge.innerText = `${Object.keys(db).length} Prod.`;
  }

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.value = 1800;
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.08);
    } catch (e) {}
  }

  async function toggleCamera() {
    if (typeof Html5Qrcode === 'undefined') {
      alert("Error: La librería del escáner no cargó. Revisa tu conexión a internet.");
      return;
    }

    const btn = document.getElementById('toggleCamBtn');
    const placeholder = document.getElementById('scanner-placeholder');

    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }

    if (isScanning) {
      try {
        await html5QrCode.stop();
        isScanning = false;
        btn.innerText = "Encender Cámara";
        btn.className = "px-3.5 py-2 bg-amber-500 text-slate-950 text-xs font-bold rounded-lg active:scale-95 transition";
        if (placeholder) placeholder.classList.remove('hidden');
      } catch (err) {
        console.error(err);
      }
    } else {
      try {
        if (placeholder) placeholder.classList.add('hidden');

        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 150 } },
          onScanSuccess
        );

        isScanning = true;
        btn.innerText = "Apagar Cámara";
        btn.className = "px-3.5 py-2 bg-rose-500 text-slate-100 text-xs font-bold rounded-lg active:scale-95 transition";

      } catch (err) {
        if (placeholder) placeholder.classList.remove('hidden');
        alert("Error de acceso a la cámara. Asegúrate de estar usando HTTPS y otorgar permisos en Chrome/Safari.");
      }
    }
  }

  function onScanSuccess(decodedText) {
    if (navigator.vibrate) navigator.vibrate(60);
    playBeep();
    processBarcode(decodedText);
  }

  function processBarcode(code) {
    if (!code) return;

    if (currentTab === 'pos') {
      addToCart(code);
    } else {
      currentBarcode = code;
      const pCard = document.getElementById('productCard');
      if (pCard) pCard.classList.remove('hidden');
      
      document.getElementById('barcodeDisplay').innerText = code;

      if (db[code]) {
        document.getElementById('prodName').value = db[code].name || '';
        document.getElementById('prodPrice').value = db[code].price || '';
        document.getElementById('prodStock').value = db[code].stock !== undefined ? db[code].stock : 0;
        document.getElementById('sourceTag').innerText = "REGISTRADO";
        document.getElementById('sourceTag').className = "text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-emerald-900 text-emerald-300";
      } else {
        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodStock').value = '10';
        document.getElementById('sourceTag').innerText = "NUEVO";
        document.getElementById('sourceTag').className = "text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-amber-900 text-amber-300";
      }
    }
  }

  function saveProduct() {
    if (!currentBarcode) return;
    const name = document.getElementById('prodName').value.trim();
    const price = parseFloat(document.getElementById('prodPrice').value) || 0;
    const stock = parseInt(document.getElementById('prodStock').value) || 0;

    if (!name) return alert("Escribe un nombre para el producto.");

    db[currentBarcode] = { name, price, stock };
    saveDB();
    document.getElementById('sourceTag').innerText = "GUARDADO";
    document.getElementById('sourceTag').className = "text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-emerald-900 text-emerald-300";
    alert("Producto guardado correctamente");
  }

  function addCurrentToCart() {
    if (!currentBarcode) return;
    if (!db[currentBarcode]) {
      saveProduct();
    }
    addToCart(currentBarcode);
    switchTab('pos');
  }

  function addManualToCart() {
    const input = document.getElementById('manualBarcodePOS');
    const code = input.value.trim();
    if (!code) return;
    addToCart(code);
    input.value = '';
  }

  function addToCart(code) {
    if (!db[code]) {
      alert(`El código ${code} no existe en el inventario. Agrégalo primero en la pestaña Escáner.`);
      return;
    }

    const existingIndex = cart.findIndex(item => item.code === code);
    if (existingIndex > -1) {
      cart[existingIndex].qty += 1;
    } else {
      cart.push({
        code: code,
        name: db[code].name,
        price: db[code].price,
        qty: 1
      });
    }
    renderCart();
  }

  function updateQty(index, delta) {
    cart[index].qty += delta;
    if (cart[index].qty <= 0) {
      cart.splice(index, 1);
    }
    renderCart();
  }

  function clearCart() {
    cart = [];
    document.getElementById('payAmount').value = '';
    renderCart();
  }

  function renderCart() {
    const container = document.getElementById('cartList');
    if (!container) return;
    container.innerHTML = '';
    let total = 0;

    if (cart.length === 0) {
      container.innerHTML = `<p class="text-slate-500 text-center py-4">Sin productos en el carrito.</p>`;
      document.getElementById('cartTotal').innerText = '$0.00';
      calculateChange();
      return;
    }

    cart.forEach((item, index) => {
      const itemTotal = item.price * item.qty;
      total += itemTotal;

      container.innerHTML += `
        <div class="flex justify-between items-center pt-2">
          <div>
            <p class="font-bold text-slate-200 text-xs">${item.name}</p>
            <p class="text-emerald-400 font-mono text-[11px]">$${item.price.toFixed(2)} x ${item.qty} = $${itemTotal.toFixed(2)}</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="updateQty(${index}, -1)" class="w-6 h-6 bg-slate-700 text-slate-200 rounded font-bold hover:bg-slate-600">-</button>
            <span class="font-mono text-xs w-4 text-center">${item.qty}</span>
            <button onclick="updateQty(${index}, 1)" class="w-6 h-6 bg-slate-700 text-slate-200 rounded font-bold hover:bg-slate-600">+</button>
          </div>
        </div>
      `;
    });

    document.getElementById('cartTotal').innerText = `$${total.toFixed(2)}`;
    calculateChange();
  }

  function calculateChange() {
    const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    const pay = parseFloat(document.getElementById('payAmount').value) || 0;
    const changeDisplay = document.getElementById('changeAmount');

    if (!changeDisplay) return;

    if (total === 0) {
      changeDisplay.innerText = "$0.00";
      changeDisplay.className = "w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-sm font-bold text-slate-500 flex items-center";
      return;
    }

    const change = pay - total;
    if (pay >= total) {
      changeDisplay.innerText = `$${change.toFixed(2)}`;
      changeDisplay.className = "w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-sm font-bold text-emerald-400 flex items-center";
    } else {
      changeDisplay.innerText = `Falta $${Math.abs(change).toFixed(2)}`;
      changeDisplay.className = "w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs font-bold text-rose-400 flex items-center";
    }
  }

  function completeSale() {
    if (cart.length === 0) return alert("El carrito está vacío.");
    
    const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    const pay = parseFloat(document.getElementById('payAmount').value) || 0;

    if (pay < total) {
      return alert("El monto pagado es menor al total de la venta.");
    }

    cart.forEach(item => {
      if (db[item.code]) {
        db[item.code].stock = Math.max(0, (db[item.code].stock || 0) - item.qty);
      }
    });

    saveDB();
    alert(`Venta completada con éxito.\nCambio: $${(pay - total).toFixed(2)}`);
    clearCart();
  }

  function switchTab(tab) {
    currentTab = tab;
    ['scan', 'pos', 'inventory', 'data'].forEach(t => {
      const sec = document.getElementById(`sec-${t}`);
      const btn = document.getElementById(`tab-${t}`);
      if (sec) sec.classList.add('hidden');
      if (btn) btn.className = "py-2.5 text-center rounded-lg hover:bg-slate-700 text-slate-300";
    });

    const activeSec = document.getElementById(`sec-${tab}`);
    const activeBtn = document.getElementById(`tab-${tab}`);
    if (activeSec) activeSec.classList.remove('hidden');
    if (activeBtn) activeBtn.className = "py-2.5 text-center rounded-lg bg-amber-500 text-slate-950 font-bold";

    if (tab === 'inventory') renderInventory();
    if (tab === 'pos') renderCart();
  }

  function renderInventory() {
    const container = document.getElementById('inventoryList');
    if (!container) return;
    container.innerHTML = '';
    const keys = Object.keys(db);

    if (keys.length === 0) {
      container.innerHTML = `<p class="text-slate-500 text-center py-4">Sin productos guardados.</p>`;
      return;
    }

    keys.reverse().forEach(code => {
      const item = db[code];
      const lowStock = (item.stock || 0) <= 3;
      
      container.innerHTML += `
        <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800">
          <div>
            <p class="font-bold text-slate-200 text-xs">${item.name}</p>
            <p class="font-mono text-[10px] text-slate-500">${code}</p>
          </div>
          <div class="text-right">
            <p class="text-emerald-400 font-bold text-xs">$${(item.price || 0).toFixed(2)}</p>
            <p class="text-slate-400 text-[10px]">Stock: <span class="font-bold ${lowStock ? 'text-rose-400' : 'text-slate-200'}">${item.stock || 0}</span></p>
          </div>
        </div>
      `;
    });
  }

  function exportJSON() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
    const a = document.createElement('a');
    a.href = dataStr;
    a.download = `inventario_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }
        </script>
